<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fidelización · Junio 2026 — Ibaceta</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--azul:#00548A;--naranja:#F1891B;--gris-bg:#F0F2F5;--font-h:'Montserrat',sans-serif;--font-b:'Open Sans',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--font-b);background:var(--gris-bg);display:flex;flex-direction:column;}
.topbar{background:var(--azul);border-bottom:4px solid var(--naranja);color:#fff;padding:10px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;flex:0 0 auto;}
.topbar .ttl{font-family:var(--font-h);font-weight:700;font-size:1.1rem;}
.topbar .sub{font-size:.74rem;color:rgba(255,255,255,.7);}
.tabs{display:flex;gap:0;background:var(--azul);padding:0 14px;flex:0 0 auto;flex-wrap:wrap;}
.tab{font-family:var(--font-h);text-align:left;border:none;cursor:pointer;background:rgba(255,255,255,.10);
  color:rgba(255,255,255,.82);padding:9px 20px;border-radius:8px 8px 0 0;margin-right:4px;
  display:flex;flex-direction:column;line-height:1.2;transition:.15s;}
.tab:hover{background:rgba(255,255,255,.20);}
.tab.active{background:var(--gris-bg);color:var(--azul);}
.tab .t-lbl{font-weight:700;font-size:.9rem;}
.tab .t-desc{font-size:.66rem;opacity:.8;font-family:var(--font-b);}
.tab.active .t-desc{opacity:.65;}
.stage{flex:1 1 auto;position:relative;}
.frame{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;background:#fff;}
.frame.active{display:block;}
.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:.9rem;}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="ttl">Fidelización · Junio 2026</div></div>
  <div class="sub">Actualizado 26/06/2026</div>
</div>
<div class="tabs">
<button class="tab" data-tab="salon" data-src="funnel_salon.html" onclick="show(this)"><span class="t-lbl">Funnel de Salón</span><span class="t-desc">Rentabilidad de clientes por monto y recencia</span></button>
<button class="tab" data-tab="fuga" data-src="fuga_canales.html" onclick="show(this)"><span class="t-lbl">Fuga de Canales</span><span class="t-desc">Clientes Web que compran en otros canales</span></button>
<button class="tab" data-tab="rec" data-src="recompra_web.html" onclick="show(this)"><span class="t-lbl">Recompra Web</span><span class="t-desc">Cuántos clientes Web vuelven a comprar</span></button>
</div>
<div class="stage">
<iframe class="frame" id="fr-salon" title="Funnel de Salón"></iframe>
<iframe class="frame" id="fr-fuga" title="Fuga de Canales"></iframe>
<iframe class="frame" id="fr-rec" title="Recompra Web"></iframe>
</div>
<script>
function show(btn){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".frame").forEach(f=>f.classList.remove("active"));
  btn.classList.add("active");
  const id=btn.dataset.tab;
  const fr=document.getElementById("fr-"+id);
  if(!fr.src){ fr.src=btn.dataset.src; }   // carga diferida: solo al primer clic
  fr.classList.add("active");
}
// activar primera pestaña
show(document.querySelector(".tab"));
</script>
</body>
</html>
