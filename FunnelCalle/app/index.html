<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B4F8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Funnel Calle">
<title>Funnel Comercial — Calle</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --azul:#1B4F8C; --naranja:#E8762C; --rojo:#C0392B; --verde:#16A085;
  --violeta:#9B59B6; --gris:#6b7280; --fondo:#f3f5f7; --borde:#e3e6ea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding-bottom:env(safe-area-inset-bottom);font-family:system-ui,"Segoe UI",sans-serif;background:var(--fondo);color:#1f2937;font-size:15px}
button,select,input,textarea{font-family:inherit;font-size:15px}

#login{position:fixed;inset:0;background:var(--azul);display:flex;align-items:center;justify-content:center;
       padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));z-index:50}
#login .caja{background:#fff;border-radius:14px;padding:26px 22px;width:100%;max-width:360px}
#login h1{margin:0 0 4px;font-size:1.15rem;color:var(--azul)}
#login p{margin:0 0 18px;font-size:.82rem;color:var(--gris)}
#login input{width:100%;padding:12px;border:1.5px solid #ccd2d9;border-radius:8px;margin-bottom:10px}
#login button{width:100%;padding:13px;background:var(--azul);color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}
#login .error{color:var(--rojo);font-size:.82rem;margin-top:10px;display:none}

/* Cabecera = header + nav, pegados juntos. Ninguno lleva un desplazamiento escrito a
   mano: asi el nav siempre queda debajo del header, mida lo que mida. */
.cabecera{position:sticky;top:0;z-index:25}
header{background:var(--azul);color:#fff;display:flex;align-items:center;gap:10px;
       /* Instalada no hay barra del navegador: sin esto el titulo queda debajo del
          reloj y la bateria del telefono. */
       padding:calc(11px + env(safe-area-inset-top)) 14px 11px}
header .tit{flex:1;min-width:0}
header .t1{font-weight:700;font-size:.95rem;line-height:1.15}
header .t2{font-size:.71rem;opacity:.82}
header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:6px;padding:7px 11px;font-size:.76rem;cursor:pointer}
nav{display:flex;background:#fff;border-bottom:1px solid var(--borde);overflow-x:auto}
nav button{flex:1 0 auto;padding:11px 14px;background:none;border:0;border-bottom:3px solid transparent;color:var(--gris);font-weight:600;font-size:.82rem;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--azul);border-bottom-color:var(--azul)}
nav .pin{display:inline-block;min-width:17px;padding:0 5px;margin-left:4px;background:var(--naranja);color:#fff;border-radius:9px;font-size:.68rem;line-height:17px}

.barra{padding:10px 14px;background:#fff;border-bottom:1px solid var(--borde);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.barra select,.barra input{padding:8px 12px;border:1.5px solid #ccd2d9;border-radius:18px;font-size:.84rem}
/* En el telefono los cinco filtros se apretaban en un renglon y quedaban como pastillas
   con una flechita, sin texto: no se entendia que filtraba cada uno. Con este ancho
   minimo bajan de renglon de a dos y se lee el nombre. */
.barra select{flex:1 1 148px;min-width:148px;max-width:300px}
.barra input{flex:1 1 100%;min-width:150px}
/* Un filtro puesto se tiene que notar sin leerlo */
.barra select.act{border-color:var(--azul);color:var(--azul);font-weight:700;background:#f0f6ff}
/* Las casillas no se parten en dos renglones ni se desalinean del cuadradito */
.barra label{flex:0 0 auto;white-space:nowrap}
.limpiar{flex:0 0 auto;background:none;border:0;color:var(--rojo);font-size:.8rem;
         font-weight:700;cursor:pointer;padding:6px 4px;text-decoration:underline}

/* KPIs, igual que el funnel */
.kpis{display:flex;gap:9px;overflow-x:auto;padding:12px 14px 4px}
.kpi{flex:0 0 auto;min-width:118px;background:#fff;border:1px solid var(--borde);border-top:3px solid var(--naranja);border-radius:9px;padding:9px 13px}
.kpi .l{font-size:.64rem;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:1.3rem;font-weight:800;color:#111;line-height:1.15}

/* Columnas del funnel */
.cols{display:flex;gap:11px;overflow-x:auto;padding:12px 14px 28px;-webkit-overflow-scrolling:touch;align-items:flex-start}
/* En pantalla ancha las seis columnas se reparten el espacio y entran todas, como en
   el funnel. En telefono cada una ocupa casi toda la pantalla y se desliza al costado. */
.col{flex:1 1 0;min-width:168px;background:#eef1f4;border-radius:10px;overflow:hidden}
@media(max-width:900px){ .col{flex:0 0 82vw;min-width:0} }
.col-h{padding:9px 10px;text-align:center;color:#fff}
.col-h .t{font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.col-h .n{font-size:1.45rem;font-weight:800;line-height:1.1}
.col-h .r{font-size:.62rem;opacity:.9}
.col-b{padding:9px;max-height:none}
.c-inicio .col-h{background:#3498DB}.c-en_marcha .col-h{background:#2471a3}
.c-por_cerrar .col-h{background:var(--naranja)}.c-cierre_inminente .col-h{background:var(--rojo)}
.c-reasignado .col-h{background:#27ae60}
.c-refinanciar .col-h{background:var(--violeta)}.c-finalizado .col-h{background:#8d96a3}

.tar{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:10px;margin-bottom:8px}
.tar .nom{font-weight:700;font-size:.87rem;line-height:1.25;color:var(--azul)}
.tar .loc{font-size:.74rem;color:var(--gris);margin-top:1px}
.tar .cu{font-size:.8rem;color:var(--naranja);font-weight:700;margin-top:4px}
.tar .de{font-size:.74rem;color:#444;margin-top:2px}
/* La observacion en la tarjeta: una linea, recortada. La completa esta en la ficha. */
.tel.llamar{font-size:.68rem;opacity:.7;border:1px solid #ccd2d9;border-radius:5px;padding:1px 5px}
/* Dato corregido a mano: se ve distinto del que viene del ERP */
.corr{background:#eef9f1;border-left:3px solid #27ae60;border-radius:4px;padding:4px 7px;
      margin:5px 0;font-size:.74rem;color:#1d6b43}
.corr .de{display:block;font-size:.66rem;opacity:.75}
.nota{background:#fffbe9;border-left:3px solid #E8C14C;border-radius:4px;padding:4px 7px;
      margin:5px 0;font-size:.74rem;color:#6b5b1e;white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis}
.tar .te{font-size:.74rem;margin-top:3px}
.b{display:block;width:100%;margin-top:6px;padding:7px;border-radius:6px;border:1.5px solid var(--azul);background:#fff;color:var(--azul);font-size:.76rem;font-weight:700;cursor:pointer}
.b.full{background:var(--azul);color:#fff}
.b.verde{border-color:var(--verde);color:var(--verde)}.b.verde.full{background:var(--verde);color:#fff}
.b.auto{display:inline-block;width:auto;margin:0 6px 0 0;padding:7px 13px}
a.tel{color:var(--azul);text-decoration:none;font-weight:600}
/* Ficha: tarjeta de operacion y cuadro de cuotas, como en el funnel */
.opc{border:1px solid var(--borde);border-radius:9px;padding:10px;margin:8px 0;background:#fff}
.opc-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.opn{font-weight:800;color:var(--azul);font-size:.86rem}
/* OJO con el nombre: "barra" ya es la barra de filtros de arriba (linea ~46). Cuando
   esta regla se llamaba igual, la pisaba y dejaba los filtros aplastados a 6px de alto,
   con los selectores desbordados y los KPIs encima. */
.avance{height:6px;background:#eef1f4;border-radius:4px;overflow:hidden;margin:6px 0 3px}
.avance>div{height:100%;background:var(--azul)}
.tcuotas{width:100%;border-collapse:collapse;font-size:.7rem}
.tcuotas th{background:#f5f5f5;font-weight:700;color:#555;padding:3px 6px;text-align:center}
.tcuotas td{padding:3px 6px;border-bottom:1px solid #f0f0f0}
.badge{display:inline-block;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:9px;color:#fff;margin:0 3px 3px 0}
.chip{display:inline-block;font-size:.69rem;font-weight:700;padding:3px 7px;border-radius:9px;background:#eef1f4;color:#555;margin-top:5px}
.chip.venc{background:#fdecea;color:var(--rojo)}.chip.hoy{background:#fdf0e3;color:#b35309}
.av-wrap{padding:12px 14px 28px;max-width:860px}
.av-h{font-size:.72rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
      color:#6b7684;margin:16px 0 8px}
.av-card{background:#fff;border:1px solid #e3e8ee;border-radius:10px;padding:12px 14px;
         margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.av-fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.av-u{font-weight:800;font-size:.92rem}
.av-meta{font-size:.72rem;color:#6b7684}
.av-sel{flex:1 1 190px;min-width:160px;padding:7px 9px;border:1px solid #cfd6de;
        border-radius:7px;font-family:inherit;font-size:.82rem;background:#fff}
.av-btn{padding:7px 14px;border:0;border-radius:7px;background:var(--azul,#00548A);
        color:#fff;font-weight:700;font-size:.78rem;cursor:pointer;font-family:inherit}
.av-btn:disabled{background:#c3cad2;cursor:default}
.av-btn.sec{background:#fff;color:var(--azul,#00548A);border:1.5px solid var(--azul,#00548A)}
.av-in{padding:7px 9px;border:1px solid #cfd6de;border-radius:7px;font-family:inherit;
       font-size:.82rem;flex:1 1 150px;min-width:130px}
.av-nota{font-size:.72rem;color:#6b7684;line-height:1.5;margin:6px 0 0}
.av-ok{background:#e7f3ec;border-color:#bcdcc8}
.av-vacio{color:#6b7684;font-size:.84rem;padding:14px 2px}
.sel-tag{width:100%;margin-top:6px;padding:6px;border:1.5px solid #ccd2d9;border-radius:6px;font-size:.74rem;color:#555;background:#fafbfc}
.chip.prox{background:#eaf2fb;color:#1f6fb2}.chip.sin{background:#f4f4f4;color:#9ca3af;font-style:italic;font-weight:500}

.panel{margin:12px 14px;background:#fff;border:1px solid var(--borde);border-radius:10px;padding:13px}
.panel h3{margin:0 0 9px;font-size:.92rem}
.titulo{font-weight:700;font-size:.8rem;margin:11px 0 6px;color:#374151}
.act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--borde);border-radius:7px;padding:8px 10px;margin-bottom:6px;font-size:.81rem}
.act.venc{border-left:4px solid var(--rojo)}.act.hoy{border-left:4px solid var(--naranja)}
.act.prox{border-left:4px solid #3498DB}
.tabla{width:100%;border-collapse:collapse;font-size:.8rem}
.tabla th{text-align:left;background:var(--azul);color:#fff;padding:7px 9px;font-size:.72rem;white-space:nowrap}
.tabla td{padding:7px 9px;border-bottom:1px solid #eee}
.tabla tr{cursor:pointer}
.vacio{text-align:center;color:#9ca3af;font-size:.85rem;padding:26px 10px}
.cargando{text-align:center;padding:40px;color:var(--gris)}

.capa{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
.capa.on{display:flex}
.hoja{background:#fff;width:100%;max-width:540px;border-radius:14px 14px 0 0;max-height:88vh;
      overflow-y:auto;padding:18px;
      /* El ultimo boton quedaba debajo de la barra de gestos del telefono. */
      padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media(min-width:560px){.capa{align-items:center}.hoja{border-radius:14px}}
.hoja h2{margin:0 0 3px;font-size:1.02rem}
.hoja .cierra{float:right;background:none;border:0;font-size:1.4rem;color:#9ca3af;cursor:pointer;line-height:1}
.campo{margin-bottom:11px}
.campo label{display:block;font-size:.77rem;font-weight:700;margin-bottom:4px;color:#374151}
.campo input,.campo select,.campo textarea{width:100%;padding:10px;border:1.5px solid #ccd2d9;border-radius:7px}
.acciones{display:flex;gap:9px;justify-content:flex-end;margin-top:15px}
</style>
</head>
<body>

<div id="login">
  <div class="caja">
    <h1>Funnel Comercial — Calle</h1>
    <p>Entrá con tu usuario y contraseña de siempre.</p>
    <div id="ver" style="font-size:.68rem;color:#9ca3af;margin:-12px 0 12px"></div>
    <button class="btn-instalar" style="display:none;background:var(--naranja);margin-bottom:12px"
            onclick="instalar()">Instalar en el celular</button>
    <button id="comoInstalar" style="display:none;background:none;color:#cfe0f5;border:1px solid #4a7cb8;
            margin-bottom:12px;font-size:.8rem" onclick="abrir('m-inst')">¿Cómo la instalo?</button>
    <input id="lu" placeholder="Usuario" autocapitalize="characters" autocomplete="username"
           autocorrect="off" spellcheck="false">
    <input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false">
    <label style="display:flex;align-items:center;gap:7px;font-size:.8rem;color:#6b7280;margin:-2px 0 12px;cursor:pointer">
      <input type="checkbox" id="ojo" onchange="verClave()" style="width:auto;margin:0"> Ver contraseña
    </label>
    <button id="lb">Entrar</button>
    <div class="error" id="le"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="cabecera">
    <header>
      <div class="tit"><div class="t1">Funnel Comercial — Calle</div><div class="t2" id="hsub"></div></div>
      <button class="btn-instalar" style="display:none;background:var(--naranja)"
              onclick="instalar()">Instalar</button>
      <button onclick="salir()">Salir</button>
    </header>
    <nav id="nav"></nav>
  </div>
  <div id="barra" class="barra" style="display:none"></div>
  <div class="kpis" id="kpis"></div>
  <div id="panel"></div>
  <div class="cols" id="cols"></div>
  <div id="tabla"></div>
</div>

<div class="capa" id="m-ficha"><div class="hoja">
  <button class="cierra" onclick="cerrar('m-ficha')">&times;</button>
  <h2 id="f-nom"></h2><div id="f-cuerpo"></div>
</div></div>

<div class="capa" id="m-act"><div class="hoja">
  <button class="cierra" onclick="cerrar('m-act')">&times;</button>
  <h2 id="a-tit">Agendar actividad</h2>
  <div id="a-cli" style="font-size:.83rem;color:var(--gris);margin-bottom:12px"></div>
  <div class="campo"><label>Acción</label><select id="a-tipo">
    <option value="llamada">Llamada</option><option value="visita">Visita</option>
    <option value="whatsapp">WhatsApp</option><option value="tarea">Tarea</option></select></div>
  <div class="campo"><label>Fecha</label><input type="date" id="a-fecha"></div>
  <div class="campo"><label>Hora (opcional)</label><input type="time" id="a-hora"></div>
  <div class="campo"><label>Observaciones</label><textarea id="a-obs" rows="3"></textarea></div>
  <div class="acciones"><button class="b auto" onclick="cerrar('m-act')">Cancelar</button>
    <button class="b auto full" onclick="guardarAct()">Guardar</button></div>
</div></div>

<div class="capa" id="m-inst"><div class="hoja">
  <button class="cierra" onclick="cerrar('m-inst')">&times;</button>
  <h2>Cómo instalarla en el celular</h2>
  <div id="i-cuerpo" style="font-size:.88rem;line-height:1.5"></div>
  <div class="acciones"><button class="b auto full" onclick="cerrar('m-inst')">Entendido</button></div>
</div></div>

<div class="capa" id="m-datos"><div class="hoja">
  <button class="cierra" onclick="cerrar('m-datos')">&times;</button>
  <h2>Corregir datos del cliente</h2>
  <div id="d-cli" style="font-size:.83rem;color:var(--gris);margin-bottom:4px"></div>
  <div id="d-dest" style="font-size:.78rem;color:var(--gris);margin-bottom:12px"></div>
  <div class="campo"><label>Teléfono</label><input type="tel" id="d-tel" placeholder="Ej.: 2615155532"></div>
  <div class="campo"><label>Dirección</label><input type="text" id="d-dir" placeholder="Calle, número, barrio"></div>
  <div class="campo"><label>Tipo de negocio</label><select id="d-neg"
      onchange="document.getElementById('d-negotro').style.display=this.value==='__otro'?'block':'none'"></select></div>
  <div class="campo" id="d-negotro" style="display:none"><label>¿Cuál?</label>
    <input type="text" id="d-negtxt" placeholder="Escribilo en singular, ej.: VIVERO"></div>
  <div class="campo"><label>Nota (opcional)</label><textarea id="d-obs" rows="2"
    placeholder="Ej.: me lo dio el hijo, el anterior no existe más"></textarea></div>
  <div class="acciones"><button class="b auto" onclick="cerrar('m-datos')">Cancelar</button>
    <button class="b auto full" onclick="guardarDatos()">Guardar y avisar</button></div>
</div></div>

<div class="capa" id="m-cerr"><div class="hoja">
  <button class="cierra" onclick="cerrar('m-cerr')">&times;</button>
  <h2>¿Qué pasó?</h2>
  <div id="c-cli" style="font-size:.83rem;color:var(--gris);margin-bottom:12px"></div>
  <div class="campo"><label>Resultado</label><select id="c-res"></select></div>
  <div class="campo"><label>Nota (opcional)</label><textarea id="c-nota" rows="3"></textarea></div>
  <div class="acciones"><button class="b auto" onclick="cerrar('m-cerr')">Cancelar</button>
    <button class="b auto full" onclick="guardarCierre()">Guardar</button></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyDw5qyz5bR5zOD-JxH2dbSUuafOiHgFovc",
  authDomain:"ibaceta-funnel.firebaseapp.com",
  projectId:"ibaceta-funnel",
  storageBucket:"ibaceta-funnel.firebasestorage.app",
  messagingSenderId:"887640429368",
  appId:"1:887640429368:web:4c732bf5eace6a7498e7cd"
});
const db = firebase.firestore();
// Deja los datos en el telefono: abre y funciona sin señal, que es donde trabajan los
// vendedores. Lo hecho sin conexion sincroniza al volver.
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

const VERSION="2026-10-10f";
const DOMINIO="funnel.ibaceta.ar";
const NEGOCIOS=["ALMACEN","TODO SUELTO","KIOSCO VENTANA","PANIFICADORA","ROTISERÍA",
  "VERDULERIA","CARNICERIA","AVÍCOLA","MINIMARKET","PELUQUERIA","ART DE LIMPIEZA",
  "LIBRERIA","BAR-CAFE","PET SHOP","RESTAURANT","INDUMENTARIA","FIAMBRERIA",
  "TALLER MECANICO","CENTRO DE ESTETICA","PROVEEDORES","LUBRICENTRO","FERRETERIA",
  "HELADERIA","VTA DE BEBIDAS","LAVADERO","FABRICA DE EMBUTIDOS"];
const TIPOS={llamada:"Llamada",visita:"Visita",whatsapp:"WhatsApp",tarea:"Tarea",
             dato:"Actualizar datos en el ERP"};
// Una correccion de datos no se cierra con "contactado": se cierra diciendo si se
// cargo en el ERP o si el dato no servia.
const RES_DATO=[["cargado_erp","Lo cargué en el ERP",false],
                ["dato_incorrecto","El dato no era correcto",false]];
const RESULTADOS=[["contactado_interesado","Contactado - interesado",true],
  ["contactado_no_ahora","Contactado - no ahora",true],["no_contactado","No contactó",true],
  ["no_interesa","No le interesa",false],["vendido","Vendido",false],
  ["datos_erroneos","Datos erróneos (tel/dir)",false]];
// Mismas etapas, mismos nombres y mismo orden que el funnel de siempre.
const TAGS=[["sin_local","Ya no tiene local","#E8762C"],
            ["incobrable","Incobrable","#C0392B"],
            ["fallecido","Fallecido","#7F8C8D"]];
// Las etiquetas viven en el MISMO documento que usa el funnel HTML (funnel_calle/_shared).
// Asi lo que se marca en la app se ve en el tablero viejo y al reves, que es lo que hace
// falta mientras los dos conviven.
let tags={}, asignaciones={}, comentarios={}, datos={};
const ETAPAS=[["inicio","Inicio","0% - 50%"],["en_marcha","En marcha","50% - 75%"],
  ["por_cerrar","Por cerrar","75% - 90%"],["cierre_inminente","Cierre inminente","90% - 100%"],
  ["refinanciar","Refinanciar","Saldo > 0"],["finalizado","Finalizado","> 100%"]];

let sesion=null, clientes=[], actividades=[], desus=[];
// Un vendedor recibe clientes por dos vias: los que el ERP le asigna y los que le
// reasignaron a mano. Firestore no deja preguntar por las dos condiciones en una sola
// consulta, asi que son dos escuchas y aca se unen sin repetir.
let _cliErp=[], _cliAsig=[];
function _fusionarClientes(){
  const vistos=new Set(); clientes=[];
  for(const c of _cliErp.concat(_cliAsig)){
    const k=String(c.codigo);
    if(!vistos.has(k)){ vistos.add(k); clientes.push(c); }
  }

function esEmpleado(c){

const correo=u=>u.trim().toLowerCase().replace(/[^a-z0-9]+/g,".").replace(/^\.|\.$/g,"")+"@"+DOMINIO;
// Los telefonos del ERP vienen pegados, con punto y coma, con 54/549 adelante o con
// varios numeros en un mismo campo. Partirlos por espacios -- como hacia antes -- los
// rompia en pedazos ("+54 · 9 · 261 · 270 · 0889"). Misma logica que el funnel.
function tel(raw){
  if(!raw) return "";
  const partes=String(raw).split(/[;,\n\r]|  +/).map(x=>x.trim()).filter(Boolean);
  const links=[];
  partes.forEach(parte=>{
    let d=parte.replace(/\D/g,"");
    if(d.startsWith("549")&&d.length===13) d=d.slice(3);
    else if(d.startsWith("54")&&d.length===12) d=d.slice(2);
    else if(d.startsWith("0")) d=d.slice(1);
    if(d.length<7) return;
    const trozos = d.length>13 ? (d.match(/.{1,10}/g)||[d]) : [d];
    trozos.forEach(c=>{
      if(c.length<7) return;
      // 10 digitos = celular: el numero entero abre WhatsApp, igual que en el funnel.
      // Antes el numero llamaba y WhatsApp era un "wa" diminuto al costado, que en un
      // telefono no lo ve nadie. El boton de llamar queda, chico, porque a veces hace
      // falta y en el funnel no se podia.
      if(c.length===10){
        links.push(`<a class="tel" target="_blank" href="https://wa.me/549${c}">&#128222; ${c}</a>`
          + ` <a class="tel llamar" href="tel:${c}">llamar</a>`);
      } else {
        links.push(`<a class="tel" href="tel:${c}">${c}</a>`);
      }
    });
  });
  return [...new Set(links)].join(" · ");
}

                             vendPorDiv=d.data().por_division||{}; pintar(); } })
    .catch(()=>{});

  desus.push(db.collection("funnel_calle").doc("_shared").onSnapshot(d=>{
    tags = (d.exists && d.data().tags) ? d.data().tags : {};
    // Las reasignaciones se comparten con el funnel HTML: si el supervisor mueve un

    asignaciones = (d.exists && d.data().asignaciones) ? d.data().asignaciones : {};

function asignarA(cod, usuario){
  const ref=db.collection("funnel_calle").doc("_shared");

  //    sincronizador en cada corrida.
  const dato = usuario ? usuario : firebase.firestore.FieldValue.delete();
  ref.update(fp,dato).catch(()=>{ if(usuario){ const o={}; o[String(cod)]=usuario;
    ref.set({asignaciones:o},{merge:true}).catch(()=>{}); } });
  // 2) Y se copia al cliente y a su historial para que el vendedor nuevo lo vea en el
  //    acto, sin esperar la corrida de la noche. Las reglas solo dejan tocar ese campo.

  //    compartido: la asignacion no se pierde, se ve mas tarde.
  const marca={vendedor_asig: usuario ? usuario : firebase.firestore.FieldValue.delete()};
  ["clientes","historial"].forEach(col=>{
    db.collection(col).doc(String(cod)).update(marca)

// Misma regla que el funnel: huerfano es el cliente que quedo SIN DIVISION, que es lo
// que pasa cuando su vendedor no esta en el mapeo de activos (se fue, o nunca se cargo).
// Antes se miraba si el vendedor estaba en la lista de logins, y esa lista incluye
// cobradores y gerencia: la tabla quedaba vacia o con otra gente que la del funnel.
// Si ya fue reasignado a mano, deja de estar huerfano.
// El reasignado NO sale de la tabla: en el funnel queda listado y marcado en verde,
// para que se vea quien lo tomo y se pueda corregir.
function esHuerfano(c){ return !c.division; }
// Vendedores a ofrecer: los de la division de origen del cliente. Si no se pudo inferir
// la division, se ofrecen todos los activos antes que dejar el selector vacio.
function vendsParaHuerfano(c){
  const divs=c.div_huerf||[];
  const out=[];
  divs.forEach(d=>(vendPorDiv[d]||[]).forEach(v=>{ if(!out.includes(v)) out.push(v); }));
  if(out.length) return out.sort();
  return Object.values(vendPorDiv).flat().filter((v,i,a)=>a.indexOf(v)===i).sort();
}

const soloDig=x=>String(x||"").replace(/\D/g,"");

// El ERP trae "NO DEFINIDO" en 7 de cada 10 clientes activos. Eso cuenta como vacio:
// si no, filtrar por tipo de negocio devolveria "NO DEFINIDO" como si fuera un rubro.
function negDe(c){
  const d=correccionDe(c.codigo);
  if(d&&d.neg) return {valor:d.neg, corregido:true, por:d.por, fecha:d.fecha};
  const e=String(c.negocio||"").trim();
  return {valor:(!e||e.toUpperCase()==="NO DEFINIDO")?"":e, corregido:false};
}
function dirDe(c){
  const d=correccionDe(c.codigo);
  return (d&&d.dir) ? {valor:d.dir, corregido:true, por:d.por, fecha:d.fecha}
                    : {valor:c.domicilio||"", corregido:false};

// Cuando el ERP ya trae el dato corregido, la correccion se retira sola. Sin esto un
// numero viejo quedaria tapando al del ERP para siempre, y nadie se acordaria de
// limpiarlo.
let _limpiezaHecha=false;
function limpiarCorregidosYaCargados(){
  if(_limpiezaHecha||!clientes.length||!Object.keys(datos).length) return;
  _limpiezaHecha=true;
  const ref=db.collection("funnel_calle").doc("_shared");
  Object.keys(datos).forEach(cod=>{
    const c=clientes.find(x=>String(x.codigo)===String(cod)); if(!c) return;
    const d=datos[cod];
    const telOk = !d.tel || soloDig(c.telefono).includes(soloDig(d.tel));
    const dirOk = !d.dir || String(c.domicilio||"").trim().toUpperCase()
                             ===String(d.dir).trim().toUpperCase();
    const negOk = !d.neg || String(c.negocio||"").trim().toUpperCase()
                             ===String(d.neg).trim().toUpperCase();
    if(telOk&&dirOk&&negOk){
      delete datos[cod];
      ref.update(new firebase.firestore.FieldPath("datos",String(cod)),
                 firebase.firestore.FieldValue.delete()).catch(()=>{});
    }
  });
}

      +'</div></div>';
  });

  if(listos.length){
    h+='<div class="av-h">Asignados, se aplican en la proxima actualizacion ('+listos.length+')</div>';
    listos.forEach(x=>{
      h+='<div class="av-card av-ok"><div class="av-fila">'
        +'<div style="flex:1 1 160px"><div class="av-u">'+esc(x.usuario)+'</div>'
        +'<div class="av-meta">'+esc(x.lugar)+(x.asignado_por?' &middot; por '+esc(x.asignado_por):'')+'</div></div>'
        +'<button class="av-btn sec" onclick="avDeshacer(\''+esc(x._id)+'\')">Deshacer</button>'
        +'</div></div>';
    });
  }

  if(esGerente()){
    h+='<div class="av-h">Dar de alta un vendedor nuevo</div>'
      +'<div class="av-card"><div class="av-fila">'
      +'<input class="av-in" id="av-usr" placeholder="Usuario del ERP (ej: GHUGO)" autocapitalize="characters">'
      +'<input class="av-in" id="av-nom" placeholder="Nombre (opcional)">'
      +'<select class="av-sel" id="av-lug">'+avOpciones("")+'</select>'
      +'<button class="av-btn" onclick="avAlta()">Agregar</button></div>'
      +'<p class="av-nota"><b>El usuario tiene que ser el del ERP</b>, no el nombre: es lo unico '
      +'que el sistema consulta. Si se escribe mal, la fila nunca coincide con nadie y la venta '
      +'del vendedor real sigue sin contarse. Sirve para cargarlo <b>antes</b> de su primera venta; '
      +'vale para el contado y para la venta semanal.</p></div>';
  }

  h+='</div>';
  document.getElementById("cols").innerHTML=h;
}

function avAsignar(id){
  const sel=document.getElementById("sel-"+id); if(!sel||!sel.value) return;
  db.collection("vendedores_asignacion").doc(id).update({
    lugar:sel.value, asignado_por:sesion.usuario,
    asignado_en:new Date().toISOString().slice(0,16).replace("T"," ")
  }).catch(e=>alert("No se pudo asignar: "+e.message));
}

function avDeshacer(id){
  db.collection("vendedores_asignacion").doc(id).update({lugar:null})
    .catch(e=>alert("No se pudo deshacer: "+e.message));
}

function avAlta(){
  const u=(document.getElementById("av-usr").value||"").trim().toUpperCase();
  const n=(document.getElementById("av-nom").value||"").trim().toUpperCase();
  const l=document.getElementById("av-lug").value;
  if(!u||!l){ alert("Falta el usuario del ERP o el punto de venta."); return; }
  if(!confirm("Dar de alta a "+u+" en "+l+"?\n\nEl usuario tiene que coincidir exactamente con el del ERP.")) return;
  const id=u.replace(/\//g,"_");
  db.collection("vendedores_asignacion").doc(id).set({
    usuario:u, nombre:n||null, lugar:l, origen:"manual",
    asignado_por:sesion.usuario, provincia:sesion.zona||"",
    detectado:new Date().toISOString().slice(0,16).replace("T"," "),
    importe:0, fuente:"alta manual", aplicado:false
  }).then(()=>{
    document.getElementById("av-usr").value="";
    document.getElementById("av-nom").value="";
  }).catch(e=>alert("No se pudo dar de alta: "+e.message));
}

// ---------- navegacion ----------
function pintarNav(){
  const n=document.getElementById("nav"); let h="";
  if(conduce()) h+=`<button data-v="sup" onclick="irA('sup')">Vista Supervisor</button>`;
  if(conduce()||esVend()) h+=`<button data-v="vend" onclick="irA('vend')">Vista Vendedor<span class="pin" id="pin" style="display:none">0</span></button>`;
  if(conduce()||esCob())  h+=`<button data-v="cob" onclick="irA('cob')">Vista Cobrador</button>`;
  if(puedeAsignar()) h+=`<button data-v="asig" onclick="irA('asig')">Vendedores<span class="pin" id="pin-asig" style="display:none">0</span></button>`;
  n.innerHTML=h; marcarNav();
}
function marcarNav(){ document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===vista)); }
function irA(v){ vista=v; marcarNav(); pintar(); window.scrollTo(0,0); }

// ---------- pintado ----------
function pintar(){
  const n=pend().length, p=document.getElementById("pin");
  if(p){ p.textContent=n; p.style.display=n?"inline-block":"none"; }
  pintarBarra();
  if(vista==="asig"){ pintarAsignacion(); document.getElementById("barra").style.display="none"; }
  else if(vista==="sup") pintarSupervisor();
  else pintarKanban();
}

function pintarBarra(){
  const b=document.getElementById("barra");
  b.style.display="flex";
  const fijo = vista==="sup" || (vista==="vend"&&esVend())||(vista==="cob"&&esCob());
  let h="";
  if(!fijo){
    const campo = vista==="vend" ? "vendedores" : "cobradores";
    const set=new Set(); clientes.forEach(c=>(c[campo]||[]).forEach(x=>x&&set.add(x)));
    if(vista==="vend") clientes.forEach(c=>c.vendedor&&set.add(c.vendedor));
    // Quien esta usando la app siempre aparece en el selector si tiene pendientes a su
    // nombre. Sin esto, una tarea que cae en SUP COBRANZA -- que no es cobrador de
    // ninguna ruta -- no la podia ver ni la persona a la que le toca hacerla.
    if(actividades.some(a=>a.estado==="pendiente"&&a.asignado_a===sesion.usuario))
      set.add(sesion.usuario);
    const sel = vista==="vend"?selVend:selCob;
    h+=`<select onchange="elegir(this.value)"><option value="">Seleccionar ${vista==="vend"?"vendedor":"cobrador"}...</option>`+
       [...set].sort().map(v=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(v)}</option>`).join("")+`</select>`;
  }
  h+=`<input placeholder="Buscar por nombre..." value="${esc(busca)}" oninput="buscar(this.value)">`;

  const divs=[...new Set(clientes.map(c=>c.division).filter(Boolean))].sort();
  if(divs.length>1){
    h+=`<select class="${fDiv?"act":""}" onchange="fDiv=this.value;fProv='';fDepto='';pintar()"><option value="">Todas las divisiones</option>`+
       divs.map(v=>`<option value="${esc(v)}" ${v===fDiv?"selected":""}>${esc(v)}</option>`).join("")+`</select>`;
  }

  // Provincia y departamento: el funnel los tiene y sirven para armar el recorrido.
  const base=baseDe().filter(c=>!fDiv||c.division===fDiv);
  const provs=[...new Set(base.map(c=>c.provincia).filter(Boolean))].sort();
  if(provs.length>1){
    h+=`<select class="${fProv?"act":""}" onchange="fProv=this.value;fDepto='';pintar()"><option value="">Toda provincia</option>`+
       provs.map(v=>`<option value="${esc(v)}" ${v===fProv?"selected":""}>${esc(v)}</option>`).join("")+`</select>`;
  }
  const deptos=[...new Set(base.filter(c=>!fProv||c.provincia===fProv).map(c=>c.depto).filter(Boolean))].sort();
  if(deptos.length>1){
    h+=`<select class="${fDepto?"act":""}" onchange="fDepto=this.value;pintarKanban()"><option value="">Todo departamento</option>`+
       deptos.map(v=>`<option value="${esc(v)}" ${v===fDepto?"selected":""}>${esc(v)}</option>`).join("")+`</select>`;
  }
  // Tipo de negocio: la razon por la que se carga desde la calle es poder segmentar.
  const negs=[...new Set(base.map(c=>negDe(c).valor).filter(Boolean))].sort();
  const sinNeg=base.filter(c=>c.estado==="activo"&&!negDe(c).valor).length;
  if(negs.length>1){
    h+=`<select class="${fNeg?"act":""}" onchange="fNeg=this.value;pintar()"><option value="">Todo tipo de negocio</option>`+
       negs.map(v=>`<option value="${esc(v)}" ${v===fNeg?"selected":""}>${esc(v)}</option>`).join("")+
       `<option value="__sin" ${fNeg==="__sin"?"selected":""}>Sin definir (${sinNeg})</option></select>`;
  }
  const tipos=[...new Set(base.flatMap(c=>(c.operaciones||[]).map(o=>o.tipo)).filter(Boolean))].sort();
  if(tipos.length>1){
    h+=`<select class="${fTipo?"act":""}" onchange="fTipo=this.value;pintar()"><option value="">Todas las operaciones</option>`+
       tipos.map(v=>`<option value="${esc(v)}" ${v===fTipo?"selected":""}>${esc(v)}</option>`).join("")+`</select>`;
  }
  h+=`<label style="display:flex;align-items:center;gap:6px;font-size:.8rem;color:#555">
        <input type="checkbox" ${soloEtiquetados?"checked":""}
               onchange="soloEtiquetados=this.checked;pintar()" style="width:auto"> Solo etiquetados</label>`;
  // Con cinco filtros es facil dejar uno puesto y no entender por que faltan clientes.
  if(fDiv||fProv||fDepto||fTipo||fNeg||soloEtiquetados||busca){
    h+=`<button class="limpiar" onclick="limpiarFiltros()">Quitar filtros</button>`;
  }
  const nEmp=clientes.filter(esEmpleado).length;
  if(nEmp) h+=`<label style="display:flex;align-items:center;gap:6px;font-size:.8rem;color:#555"
        title="Empleados y cuentas internas que compran por el beneficio de la empresa. No son cartera comercial.">
        <input type="checkbox" ${verEmpleados?"checked":""}
               onchange="verEmpleados=this.checked;pintar()" style="width:auto">
        Incluir empleados (${nEmp})</label>`;
  // Al reescribir la barra, el campo de busqueda se destruye y se vuelve a crear: el
  // foco se perdia y habia que tocarlo de nuevo despues de CADA letra. Se guarda donde
  // estaba el cursor y se devuelve.
  const _act=document.activeElement;
  const _enBuscador = _act && _act.tagName==="INPUT" && b.contains(_act)
                      && String(_act.placeholder||"").startsWith("Buscar");
  const _pos = _enBuscador ? _act.selectionStart : null;

  b.innerHTML=h;

  if(_enBuscador){
    const _nuevo=b.querySelector('input[placeholder^="Buscar"]');
    if(_nuevo){
      _nuevo.focus();
      try{ _nuevo.setSelectionRange(_pos,_pos); }catch(e){}
    }
  }
}
function elegir(v){ if(vista==="vend") selVend=v; else selCob=v; pintar(); }

// Buscar sin redibujar en cada tecla. Con 1.170 clientes, volver a armar el tablero
// entero letra por letra hace que el campo responda tarde. Se espera a que la persona
// deje de escribir.
let _tBusca=null;
function buscar(v){
  busca=v;
  clearTimeout(_tBusca);
  _tBusca=setTimeout(()=>pintar(), 200);
}
function limpiarFiltros(){
  fDiv=fProv=fDepto=fTipo=fNeg=busca=""; soloEtiquetados=false; pintar();
}

// Mismos filtros para las tres vistas: division, provincia, departamento, tipo de
// operacion, etiquetados y buscador. En el funnel estaban en la vista supervisor y
// faltaban aca.
function filtrar(l){
  if(!verEmpleados) l=l.filter(c=>!esEmpleado(c));
  if(fDiv)   l=l.filter(c=>c.division===fDiv);
  if(fProv)  l=l.filter(c=>c.provincia===fProv);
  if(fDepto) l=l.filter(c=>c.depto===fDepto);
  if(fTipo)  l=l.filter(c=>(c.operaciones||[]).some(o=>o.tipo===fTipo));
  if(fNeg)   l=l.filter(c=>fNeg==="__sin" ? !negDe(c).valor : negDe(c).valor===fNeg);
  if(soloEtiquetados) l=l.filter(c=>!!tagDe(c.codigo));
  if(busca){ const q=busca.trim().toLowerCase();
             l=l.filter(c=>(c.nombre||"").toLowerCase().includes(q)); }
  return l;
}

function baseDe(){
  const q = vista==="vend" ? (esVend()?sesion.usuario:selVend) : (esCob()?sesion.usuario:selCob);
  if(!q) return clientes;
  return vista==="vend"
    ? clientes.filter(c=>esDe(c,q))
    : clientes.filter(c=>(c.cobradores||[]).includes(q));
}

// ---------- Vista Supervisor ----------
function pintarSupervisor(){
  document.getElementById("panel").innerHTML="";
  const lista=filtrar(clientes);   // respeta division/provincia/tipo/busqueda
  const act=lista.filter(c=>c.estado==="activo");
  const opsA=act.flatMap(opsActivas);
  const cie=act.filter(c=>opsActivas(c).some(o=>o.etapa==="cierre_inminente"));
  const fin=lista.filter(c=>c.estado!=="activo");
  kpis([["Clientes activos",act.length],["Operaciones activas",opsA.length],
        ["Cierre inminente",cie.length],["Finalizados sin renovar",fin.length],
        ["Cuota total/sem",plata(opsA.reduce((s,o)=>s+(o.cuota_semanal||0),0))]]);

  const por={};
  ETAPAS.forEach(([k])=>por[k]=0);
  lista.forEach(c=>{ const e=etapaDe(c); if(por[e]!==undefined) por[e]++; });
  document.getElementById("cols").innerHTML = ETAPAS.map(([k,l,r])=>`
    <div class="col c-${k}" style="flex:0 0 150px"><div class="col-h">
      <div class="t">${l}</div><div class="n">${por[k]}</div><div class="r">${r}</div></div></div>`).join("");

  // Tabla de vendedores. Igual que el funnel: un huerfano sin reasignar NO suma a
  // ningun vendedor -- su vendedor nativo ya no esta activo y el cliente pertenece a la
  // cartera huerfana, no a esta tabla. La columna "Sin agendar" es el agregado de la
  // app: es el numero que dispara el trabajo del dia.
  const conAct=new Set(pend().map(a=>String(a.cliente_cod)));
  const porV={};
  lista.forEach(c=>{
    const v = asignaciones[String(c.codigo)] || c.vendedor_asig
              || (c.division ? vendedorDe(c) : "");
    if(!v) return;
    const r=porV[v]||(porV[v]={v,div:c.division||"",act:0,ops:0,cie:0,fin:0,sin:0,cuotas:[]});
    if(!r.div && c.division) r.div=c.division;
    if(c.estado==="activo"){
      r.act++; const oa=opsActivas(c); r.ops+=oa.length;
      oa.forEach(o=>{ if(o.cuota_semanal>0) r.cuotas.push(o.cuota_semanal); });
      if(oa.some(o=>o.etapa==="cierre_inminente")) r.cie++;
      if(!conAct.has(String(c.codigo))) r.sin++;
    } else r.fin++;
  });
  const prom=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
  const filas=Object.values(porV).filter(r=>r.act>0).sort((a,b)=>b.act-a.act);
  // ---- Tabla por departamento ----
  // Mismos criterios que el funnel: agrupa por departamento (no por departamento+
  // division), deja afuera a los huerfanos, ordena alfabeticamente y la cuota es el
  // PROMEDIO de las cuotas semanales activas, no el total repartido entre clientes.
  const porD={};
  lista.filter(c=>c.division).forEach(c=>{
    const k=c.depto||"Sin departamento";
    const r=porD[k]||(porD[k]={depto:k,div:c.division||"",act:0,ops:0,cie:0,fin:0,cuotas:[]});
    if(c.estado==="activo"){
      r.act++; const oa=opsActivas(c); r.ops+=oa.length;
      oa.forEach(o=>{ if(o.cuota_semanal>0) r.cuotas.push(o.cuota_semanal); });
      if(oa.some(o=>o.etapa==="cierre_inminente")) r.cie++;
    } else r.fin++;
  });
  const deptoHtml=`<div class="panel"><h3>Tabla por departamento (${Object.keys(porD).length})</h3>
    <div style="overflow-x:auto"><table class="tabla">
      <tr><th>Departamento</th><th>División</th><th>Activos</th><th>Ops activas</th>
          <th>Cierre inminente</th><th>Final. sin renovar</th><th>Cuota prom.</th></tr>
      ${Object.values(porD).sort((a,b)=>a.depto.localeCompare(b.depto,"es"))
        .map(r=>`<tr><td style="font-weight:700">${esc(r.depto)}</td><td>${esc(r.div)}</td>
          <td>${r.act}</td><td>${r.ops}</td><td>${r.cie}</td><td>${r.fin}</td>
          <td>${plata(prom(r.cuotas))}</td></tr>`).join("")}
    </table></div></div>`;

  // ---- Cartera huerfana: tabla con asignacion, como el funnel ----
  // Mas reciente primero: con 3.000 registros, los que valen la pena trabajar son los
  // que compraron ultimo. Antes salian en el orden en que vinieron de la base.
  const anioDe=c=>{ const f=c.ultima_op_fecha||""; return f.length===10?+f.slice(6):0; };
  const huerf=lista.filter(c=>esHuerfano(c)).sort((a,b)=>anioDe(b)-anioDe(a));
  const huerfHtml = huerf.length ? `<div class="panel">
      <h3>Cartera huérfana (${huerf.length} registros)</h3>
      <div style="font-size:.78rem;color:var(--gris);margin-bottom:8px">
        Clientes que quedaron sin vendedor asignado. Al asignarlos, el cambio se ve
        también en el funnel. Ordenados por operación más reciente.
        ${!verEmpleados&&clientes.filter(esEmpleado).length?`<br>No se listan los
          ${clientes.filter(c=>esEmpleado(c)&&!c.division).length} del beneficio de
          empleados: no son cartera para repartir.`:""}</div>
      <div style="overflow-x:auto"><table class="tabla">
        <tr><th>Cliente</th><th>Vendedor original</th><th>División</th><th>Localidad / Zona</th>
            <th>Última operación</th><th>Fecha fin</th><th>Estado</th><th>Asignar a</th></tr>
        ${huerf.slice(0,200).map(c=>{ const asig=asignaciones[String(c.codigo)]||c.vendedor_asig||"";
          return `<tr>
          <td style="color:var(--azul);font-weight:700;cursor:pointer" onclick="ficha('${esc(c.codigo)}')">${esc(c.nombre)}</td>
          <td style="color:var(--gris)">${esc(c.vendedor||"(sin vendedor)")}</td>
          <td>${esc((c.div_huerf||[]).filter(Boolean).join(", ")||"—")}</td>
          <td>${esc(c.localidad||"—")}<div style="font-size:.7rem;color:var(--gris)">${esc(c.depto||"")}</div></td>
          <td>${esc(c.ultima_op_fecha||"—")}</td><td>${esc(c.ultima_op_fin||"—")}</td>
          <td><span class="chip">${esc(c.estado)}</span></td>
          <td><select onchange="asignarA('${esc(c.codigo)}',this.value)" style="padding:5px;border-radius:5px;font-size:.76rem;border:1.5px solid ${asig?"#27ae60":"#ccd2d9"};background:${asig?"#f0fff4":"#fff"}">
            <option value="">— Asignar a… —</option>
            ${vendsParaHuerfano(c).map(v=>`<option value="${esc(v)}" ${v===asig?"selected":""}>${esc(v)}</option>`).join("")}
          </select></td></tr>`;}).join("")}
      </table></div>
      ${huerf.length>200?`<div class="vacio">Mostrando los 200 más recientes de ${huerf.length}. Usá los filtros de arriba.</div>`:""}
    </div>` : "";
  document.getElementById("tabla").innerHTML = `<div class="panel">
    <h3>Vendedores (${filas.length})</h3>
    <div style="overflow-x:auto"><table class="tabla">
      <tr><th>Vendedor</th><th>División</th><th>Activos</th><th>Ops activas</th><th>Cierre inminente</th>
          <th>Final. sin renovar</th><th>Sin agendar</th><th>Cuota prom.</th></tr>
      ${filas.map(r=>`<tr onclick="verVend('${esc(r.v)}')">
        <td style="color:var(--azul);font-weight:700">${esc(r.v)}</td>
        <td>${esc(r.div||"—")}</td>
        <td>${r.act}</td><td>${r.ops}</td><td>${r.cie}</td><td>${r.fin}</td>
        <td style="color:${r.sin?'var(--rojo)':'inherit'};font-weight:700">${r.sin}</td>
        <td>${plata(prom(r.cuotas))}</td></tr>`).join("")}
    </table></div></div>` + deptoHtml + negHtml() + huerfHtml;
}

// Los tipos de negocio cargados desde la calle NO generan una tarea por cliente: serian
// cientos. Se juntan aca para pasarlos al ERP de una sola vez. La lista desaparece sola
// a medida que la corrida diaria trae cada uno ya cargado.
function negHtml(){
  const filas=Object.keys(datos).map(cod=>{
    const d=datos[cod]; if(!d||!d.neg) return null;
    const c=clientes.find(x=>String(x.codigo)===String(cod)); if(!c) return null;
    return {c,d};
  }).filter(Boolean);
  if(!filas.length) return "";
  return `<div class="panel"><h3>Tipos de negocio para cargar en el ERP (${filas.length})</h3>
    <div style="font-size:.78rem;color:var(--gris);margin-bottom:8px">
      Los informó alguien desde la calle. Se usan ya para segmentar en la app; esta lista
      es para pasarlos al sistema de una sola vez. Cada uno desaparece solo cuando el ERP
      lo trae cargado.</div>
    <div style="overflow-x:auto"><table class="tabla">
      <tr><th>Cliente</th><th>Código</th><th>Tipo de negocio</th><th>Lo informó</th><th>Fecha</th></tr>
      ${filas.sort((a,b)=>String(a.d.fecha||"").localeCompare(String(b.d.fecha||"")))
        .map(({c,d})=>`<tr>
        <td style="color:var(--azul);font-weight:700;cursor:pointer" onclick="ficha('${esc(c.codigo)}')">${esc(c.nombre)}</td>
        <td>${esc(c.codigo)}</td><td style="font-weight:700">${esc(d.neg)}</td>
        <td>${esc(d.por||"")}</td><td>${dmy(d.fecha)}</td></tr>`).join("")}
    </table></div></div>`;
}
function verVend(v){ selVend=v; vista="vend"; marcarNav(); pintar(); window.scrollTo(0,0); }
function kpis(l){ document.getElementById("kpis").innerHTML=l.map(([a,b])=>
  `<div class="kpi"><div class="l">${a}</div><div class="v">${b}</div></div>`).join(""); }

// ---------- Tabla de cobradores ----------
// No repite las columnas de la tabla de vendedores a proposito: al supervisor de
// cobranza no le sirve lo mismo que a uno de ventas. Lo que mira es cuanta plata tiene
// que entrar por semana en cada ruta, que parte de esa ruta se le esta terminando, y
// cuanto quedo colgado -- refinanciar y clientes marcados, que es plata que no va a
// entrar sola.
function tablaCobradores(){
  const lista=filtrar(clientes);
  const pend=actividades.filter(a=>a.estado==="pendiente");
  const porC={};
  const fila=k=>porC[k]||(porC[k]={c:k,act:0,ops:0,cobrar:0,cie:0,refi:0,saldo:0,marc:0,fin:0});
  lista.forEach(c=>{
    const cobs=(c.cobradores||[]);
    if(!cobs.length) return;
    const r=c.resumen_fin||{}, marcado=!!tagDe(c.codigo), refi=esRefinanciar(c);
    cobs.forEach(k=>{
      const f=fila(k);
      if(c.estado==="activo"){
        f.act++;
        // Solo las operaciones que cobra EL: un cliente puede tener dos operaciones
        // con cobradores distintos y la plata no es de los dos.
        const suyas=opsActivas(c).filter(o=>!o.cobrador||o.cobrador===k);
        f.ops+=suyas.length;
        f.cobrar+=suyas.reduce((x,o)=>x+(o.cuota_semanal||0),0);
        if(suyas.some(o=>o.etapa==="cierre_inminente")) f.cie++;
      } else f.fin++;
      if(refi){ f.refi++; f.saldo+=r.saldo_pend||0; }
      if(marcado) f.marc++;
    });
  });
  const hoy=hoyISO();
  Object.values(porC).forEach(f=>{
    f.avisos=pend.filter(a=>a.origen_usuario===f.c).length;
    const suyas=pend.filter(a=>a.tipo==="dato"&&a.asignado_a===f.c);
    f.datos=suyas.length;
    f.datosViejos=suyas.filter(a=>(a.fecha||"")<hoy).length;
  });
  // Las que caen en SUP COBRANZA son de clientes sin cobrador real: no son de ninguna
  // ruta, pero alguien las tiene que hacer, asi que se muestran como una fila mas.
  const sinRuta=pend.filter(a=>a.tipo==="dato"&&a.asignado_a==="SUP COBRANZA");
  const filas=Object.values(porC).sort((a,b)=>b.cobrar-a.cobrar);
  if(!filas.length) return "";
  return `<div class="panel"><h3>Cobradores (${filas.length})</h3>
    <div style="font-size:.78rem;color:var(--gris);margin-bottom:8px">
      Ordenados por lo que tienen que cobrar cada semana. Tocá una fila para ver la ruta.
      <br><b>Datos a cargar</b>: correcciones de teléfono o dirección que el vendedor
      informó y todavía no se pasaron al ERP.</div>
    <div style="overflow-x:auto"><table class="tabla">
      <tr><th>Cobrador</th><th>Clientes activos</th><th>Ops activas</th><th>A cobrar/sem</th>
          <th>Cierre inminente</th><th>Refinanciar</th><th>Saldo pendiente</th>
          <th>Marcados</th><th>Datos a cargar</th><th>Avisos abiertos</th></tr>
      ${filas.map(f=>`<tr onclick="verCob('${esc(f.c)}')">
        <td style="color:var(--azul);font-weight:700">${esc(f.c)}</td>
        <td>${f.act}</td><td>${f.ops}</td>
        <td style="font-weight:700">${plata(f.cobrar)}</td>
        <td>${f.cie}</td>
        <td>${f.refi}</td>
        <td style="color:${f.saldo?'var(--violeta)':'inherit'};font-weight:${f.saldo?700:400}">${plata(f.saldo)}</td>
        <td style="color:${f.marc?'var(--rojo)':'inherit'}">${f.marc}</td>
        <td style="font-weight:${f.datos?700:400};color:${f.datosViejos?'var(--rojo)':f.datos?'var(--naranja)':'inherit'}"
            title="${f.datosViejos?f.datosViejos+' esperando desde antes de hoy':''}">${
            f.datos||"—"}${f.datosViejos?" ("+f.datosViejos+" viejas)":""}</td>
        <td>${f.avisos}</td></tr>`).join("")}
      ${sinRuta.length?`<tr style="background:#fafbfc">
        <td style="color:var(--gris);font-style:italic">Sin cobrador de ruta</td>
        <td colspan="7" style="color:var(--gris);font-size:.75rem">Clientes cuya ruta no tiene
          un cobrador que entre al sistema. Quedan a cargo de cobranza.</td>
        <td style="font-weight:700;color:var(--naranja)">${sinRuta.length}</td><td>—</td></tr>`:""}
    </table></div></div>`;
}

// ---------- Vista Vendedor / Cobrador ----------
function pintarKanban(){
  const quien = vista==="vend" ? (esVend()?sesion.usuario:selVend) : (esCob()?sesion.usuario:selCob);
  const tablaCob = vista==="cob" ? tablaCobradores() : "";
  if(!quien){
    document.getElementById("kpis").innerHTML=""; document.getElementById("panel").innerHTML="";
    document.getElementById("tabla").innerHTML=tablaCob;
    document.getElementById("cols").innerHTML=`<div class="vacio">Seleccioná un ${vista==="vend"?"vendedor":"cobrador"} para ver su cartera.</div>`;
    return;
  }
  let src = vista==="vend"
    ? clientes.filter(c=>esDe(c,quien))
    : clientes.filter(c=>(c.cobradores||[]).includes(quien));
  src=filtrar(src);

  const act=src.filter(c=>c.estado==="activo");
  const opsA=act.flatMap(opsActivas);
  kpis([["Clientes activos",act.length],["Operaciones activas",opsA.length],
        ["Cierre inminente",act.filter(c=>opsActivas(c).some(o=>o.etapa==="cierre_inminente")).length],
        ["Finalizados sin renovar",src.filter(c=>c.estado!=="activo").length],
        ["Cuota total/sem",plata(opsA.reduce((s,o)=>s+(o.cuota_semanal||0),0))]]);

  pintarPanelActividades(quien,src);
  document.getElementById("tabla").innerHTML=tablaCob;

  const esVista = vista==="vend";
  const reasig = esVista ? src.filter(c=>esReasignado(c,quien)) : [];
  const codsR = new Set(reasig.map(c=>String(c.codigo)));
  const por={}; ETAPAS.forEach(([k])=>por[k]=[]);
  src.forEach(c=>{ if(codsR.has(String(c.codigo))) return;
                   const e=etapaDe(c); (por[e]||por.finalizado).push(c); });
  const colReasig = reasig.length ? `<div class="col c-reasignado">
      <div class="col-h"><div class="t">Reasignado</div><div class="n">${reasig.length}</div>
        <div class="r">Te los pasaron</div></div>
      <div class="col-b">${reasig.sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)))
        .slice(0,120).map(c=>tarjeta(c,quien)).join("")}
      ${reasig.length>120?`<div class="vacio">y ${reasig.length-120} más</div>`:""}</div></div>` : "";
  document.getElementById("cols").innerHTML = ETAPAS.map(([k,l,r])=>{
    const lista=por[k].sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
    return `<div class="col c-${k}">
      <div class="col-h"><div class="t">${l}</div><div class="n">${lista.length}</div><div class="r">${r}</div></div>
      <div class="col-b">${lista.slice(0,120).map(c=>tarjeta(c,quien)).join("")||'<div class="vacio" style="padding:12px">—</div>'}
      ${lista.length>120?`<div class="vacio">y ${lista.length-120} más</div>`:""}</div></div>`;
  }).join("") + colReasig;
}

function tarjeta(c,quien){
  const oa=opsActivas(c), r=c.resumen_fin||{};
  const reasignado=esReasignado(c,quien);
  const t=tagDe(c.codigo), td=TAGS.find(x=>x[0]===t);
  const cuota=oa.reduce((s,o)=>s+(o.cuota_semanal||0),0);
  const cuo=oa.reduce((s,o)=>s+(o.cuotas_restantes||0),0);
  const prox=oa.slice().sort((a,b)=>String(a.fecha_fin||"").slice(6).localeCompare(String(b.fecha_fin||"").slice(6)))[0];
  const p=proxDe(c.codigo), h=hoyISO();
  const chip = p ? `<span class="chip ${p.fecha<h?"venc":p.fecha===h?"hoy":"prox"}">${TIPOS[p.tipo]||p.tipo} · ${dmy(p.fecha)}</span>`
                 : `<span class="chip sin">Sin actividad programada</span>`;
  return `<div class="tar"${reasignado?' style="border-left:3px solid #27ae60;background:#fafffe"':''}>
    ${reasignado?`<span class="badge" style="background:#27ae60">Reasignado</span>`:""}
    ${esEmpleado(c)?`<span class="badge" style="background:#4A4A4A">Empleado</span>`:""}
    ${td?`<span class="badge" style="background:${td[2]}">${td[1]}</span>`:""}
    ${esRefinanciar(c)?`<span class="badge" style="background:var(--violeta)">Refinanciar · ${plata(r.saldo_pend)}</span>`:""}
    ${r.reformulada?`<span class="badge" style="background:#2980B9">Reformulada</span>`:""}
    ${r.cancelo_ant?`<span class="badge" style="background:var(--verde)">Canceló anticipado</span>`:""}
    <div class="nom">${esc(c.nombre)}</div>
    <div class="loc">${esc(c.localidad||"")}${c.provincia?", "+esc(c.provincia):""}</div>
    ${cuota?`<div class="cu">${plata(cuota)}/sem</div>`:""}
    ${cuo?`<div class="de">${cuo} cuota${cuo!==1?"s":""} rest.</div>`:""}
    ${prox?`<div class="de"><b>Vence: ${esc(prox.fecha_fin)}</b></div>`
          :(r.ultima_fin?`<div class="de">Finalizó: ${esc(r.ultima_fin)}</div>`:"")}
    ${(()=>{ const t=telDe(c); if(!t.valor) return "";
       return t.corregido
         ? `<div class="corr">${tel(t.valor)}<span class="de">corregido por ${esc(t.por)} · falta cargarlo en el ERP</span></div>`
         : `<div class="te">${tel(t.valor)}</div>`; })()}
    ${comentarioDe(c.codigo)?`<div class="nota" title="${esc(comentarioDe(c.codigo))}">${esc(comentarioDe(c.codigo))}</div>`:""}
    ${chip}
    <button class="b full" onclick="ficha('${esc(c.codigo)}')">Ver Ficha</button>
    <button class="b verde full" onclick="abrirAct('${esc(c.codigo)}')">${
      esVend()?"Agendar":vista==="cob"?"Avisar al vendedor":"Asignar actividad"}</button>
    <select class="sel-tag" onchange="ponerTag('${esc(c.codigo)}', this.value||null)">
      <option value="">${t?"Cambiar marca...":"Marcar cliente..."}</option>
      ${TAGS.map(([k,l])=>`<option value="${k}" ${t===k?"selected":""}>${l}</option>`).join("")}
      ${t?`<option value="">Quitar marca</option>`:""}
    </select>
  </div>`;
}

function pintarPanelActividades(quien,src){
  // Las actividades SIEMPRE quedan a cargo de un vendedor: es el que visita al cliente.
  // Por eso el cobrador no "recibe" actividades, las ORIGINA -- avisa que un cliente de
  // su ruta necesita algo. En su vista lo que sirve es ver lo que mando y si el vendedor
  // lo resolvio; listar lo que tiene asignado daba siempre cero y no se entendia nada.
  const esVistaCob = vista==="cob";
  // Hasta ahora el cobrador solo ORIGINABA actividades. Con las correcciones de datos
  // tambien recibe: la tarea de cargarlas en el ERP queda a su nombre. Por eso en su
  // vista van las dos listas, separadas.
  const P = actividades.filter(a=>a.estado==="pendiente"&&a.asignado_a===quien);
  const mandados = esVistaCob
    ? actividades.filter(a=>a.estado==="pendiente"&&a.origen_usuario===quien&&a.asignado_a!==quien)
    : [];
  const h=hoyISO();
  const venc=P.filter(a=>(a.fecha||"")<h),hoyl=P.filter(a=>(a.fecha||"")===h),fut=P.filter(a=>(a.fecha||"")>h);
  // "Sin actividad" es sin NINGUNA actividad pendiente, la haya pedido quien la haya
  // pedido. Mirando solo las de esta persona, un cliente que el vendedor ya tenia
  // agendado volvia a aparecer como si nadie lo estuviera trabajando.
  const conAct=new Set(actividades.filter(a=>a.estado==="pendiente")
                                  .map(a=>String(a.cliente_cod)));
  const sin=src.filter(c=>c.estado==="activo"&&!conAct.has(String(c.codigo)));
  if(!P.length&&!mandados.length&&!sin.length){ document.getElementById("panel").innerHTML=""; return; }
  const fila=a=>`<div class="act ${(a.fecha||"")<h?"venc":(a.fecha||"")===h?"hoy":"prox"}">
    <b style="flex:1;min-width:130px">${esc(a.cliente_nombre)}</b>
    <span class="chip">${TIPOS[a.tipo]||esc(a.tipo)} · ${dmy(a.fecha)}${a.hora?" "+esc(a.hora):""}</span>
    <span style="color:var(--gris);font-size:.72rem">${esVistaCob?"para "+esc(a.asignado_a||"—"):"de "+esc(a.origen_usuario)}</span>
    ${a.observaciones?`<div style="flex-basis:100%;color:#555;font-size:.77rem">${esc(a.observaciones)}</div>`:""}
    ${a.asignado_a===sesion.usuario?`<button class="b auto full" onclick="abrirCierre('${a.id}')">Hecha</button>`:""}
    <button class="b auto" onclick="ficha('${esc(a.cliente_cod)}')">Ficha</button></div>`;
  const bloque=(t,arr)=>arr.length?`<div class="titulo">${t} (${arr.length})</div>`+
    arr.sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")).map(fila).join(""):"";
  document.getElementById("panel").innerHTML=`<div class="panel">
    <h3>${quien===sesion.usuario?"Mis pendientes":"Pendientes de "+esc(quien)} (${P.length})</h3>
    ${bloque("Vencidas",venc)}${bloque("Hoy",hoyl)}${bloque("Próximas",fut)}
    ${P.length?"":`<div class="vacio">Sin pendientes.</div>`}
    ${mandados.length?`<div class="titulo">${quien===sesion.usuario?"Avisos que mandé a los vendedores"
        :"Avisos que mandó "+esc(quien)} (${mandados.length})</div>
      <div style="font-size:.77rem;color:var(--gris);margin-bottom:7px">
        Pedidos abiertos: el cliente necesita algo y el vendedor todavía no lo cerró.</div>
      ${mandados.sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")).map(fila).join("")}`:""}
    ${sin.length?`<div class="titulo">Sin actividad programada (${sin.length})</div>
      <div style="font-size:.77rem;color:var(--gris);margin-bottom:7px">Clientes activos que
        nadie tiene agendados: ni el vendedor ni cobranza pidieron contacto.</div>
      ${sin.slice(0,15).map(c=>`<div class="act">
        <b style="flex:1;min-width:130px">${esc(c.nombre)}</b>
        ${c.telefono?`<span>${tel(c.telefono)}</span>`:`<span style="color:var(--rojo);font-size:.73rem">sin teléfono</span>`}
        <span style="color:var(--gris);font-size:.74rem">${esc(c.localidad||"")}</span>
        <button class="b auto verde full" onclick="abrirAct('${esc(c.codigo)}')">${
          esVend()?"Agendar":esVistaCob?"Avisar al vendedor":"Asignar"}</button>
        <button class="b auto" onclick="ficha('${esc(c.codigo)}')">Ficha</button>
      </div>`).join("")}
      ${sin.length>15?`<div class="vacio">y ${sin.length-15} más en las columnas</div>`:""}`:""}
  </div>`;
}

// ---------- ficha ----------
// Es la ficha del funnel, con el detalle de cuotas incluido: es lo que mira el cobrador
// para saber que cuota quedo sin pagar y con cuantos dias de atraso. El cliente ya trae
// sus operaciones activas, asi que la ficha se dibuja al instante; el historial completo
// y las cuotas se piden aparte -- son 22 MB en total, no pueden viajar con cada cliente.
let fCod=null, fOps=null, fCuotas={}, fAbiertas=new Set();

async function ficha(cod){
  const c=clientes.find(x=>String(x.codigo)===String(cod)); if(!c) return;
  fCod=String(cod); fOps=null; fCuotas={}; fAbiertas=new Set();
  document.getElementById("f-nom").textContent=c.nombre;
  document.getElementById("f-cuerpo").innerHTML=cabeceraFicha(c);
  pintarOps(c);
  abrir("m-ficha");
  const [h,q]=await Promise.allSettled([
    db.collection("historial").doc(fCod).get(),
    db.collection("cuotas").doc(fCod).get()]);
  if(fCod!==String(cod)) return;           // mientras tanto abrieron otra ficha
  if(h.status==="fulfilled"&&h.value.exists) fOps=h.value.data().operaciones||[];
  if(q.status==="fulfilled"&&q.value.exists) fCuotas=q.value.data().ops||{};
  pintarOps(c);
}

const ffNum=f=>{const p=String(f||"").split("/");return p.length===3?+(p[2]+p[1].padStart(2,"0")+p[0].padStart(2,"0")):0;};

  return `
    ${(()=>{ const d=dirDe(c);
       const resto=`${esc(c.localidad||"")}${c.provincia?", "+esc(c.provincia):""}${c.depto?" ("+esc(c.depto)+")":""}`;

         ? `<div class="corr">${esc(d.valor)} - ${resto}<span class="de">corregida por ${esc(d.por)} · falta cargarla en el ERP</span></div>`

    ${(()=>{ const t=telDe(c); if(!t.valor) return "";
       return t.corregido
         ? `<div class="corr">${tel(t.valor)}<span class="de">corregido por ${esc(t.por)} el ${dmy(t.fecha)} · falta cargarlo en el ERP</span></div>`
         : `<div style="margin:8px 0">${tel(t.valor)}</div>`; })()}
    <button class="b auto" onclick="abrirDatos('${esc(c.codigo)}')">Corregir teléfono o dirección</button>
    ${c.email?`<div class="loc"><a href="mailto:${esc(c.email)}" style="color:var(--azul)">${esc(c.email)}</a></div>`:""}
    ${(()=>{ const n=negDe(c); return n.corregido
       ? `<div class="corr">Negocio: ${esc(n.valor)}<span class="de">cargado por ${esc(n.por)} &middot; todavía no está en el ERP</span></div>`
       : ""; })()}
    <div class="loc">Negocio: ${esc(negDe(c).valor||"sin definir")} &middot; Divisi&oacute;n: ${esc(c.division||(c.div_huerf||[]).filter(Boolean).join(", ")||"Sin asignar")}</div>
    <div class="loc">Vendedor: <b>${esc(vendedorDe(c)||"-")}</b>${
      asig&&c.vendedor&&asig!==c.vendedor?` <span style="color:var(--gris)">(del ERP: ${esc(c.vendedor)})</span>`:""
      } &middot; Cobrador: <b>${esc((c.cobradores||[]).join(", ")||"-")}</b></div>
    <div style="display:flex;gap:10px;margin:12px 0;flex-wrap:wrap">
      <div style="flex:1;min-width:140px;background:#f0f6ff;border:1.5px solid var(--azul);border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:.66rem;font-weight:700;color:#666;text-transform:uppercase">Cuota semanal activa</div>
        <div style="font-size:1.35rem;font-weight:800;color:var(--azul)">${plata(cuotaAct)}</div>
        <div style="font-size:.68rem;color:#888">${oa.length} op${oa.length!==1?"s":""} activa${oa.length!==1?"s":""}</div>
      </div>
      <div style="flex:1;min-width:140px;background:#fff8f0;border:1.5px solid var(--naranja);border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:.66rem;font-weight:700;color:#666;text-transform:uppercase">${refLab}</div>
        <div style="font-size:1.1rem;font-weight:800;color:var(--naranja)">${esc(refVal)}</div>
      </div>
    </div>
    <div class="titulo">Observaciones</div>
    <textarea id="f-coment" rows="3" placeholder="Escrib&iacute; lo que haya que saber de este cliente..."
      onchange="guardarComentario('${esc(c.codigo)}',this.value)"
      style="width:100%;padding:9px;border:1.5px solid #ccd2d9;border-radius:7px;

    <div class="titulo">Historial sal&oacute;n</div>
    <div class="loc">Primera compra: ${esc(c.salon_primera||"-")} &middot; &Uacute;ltima: ${esc(c.salon_ultima||"-")}</div>
    <div class="loc">Compras este a&ntilde;o: ${c.salon_compras_anio||0} &middot; Monto total: ${plata(c.salon_monto_total||0)}</div>`;
}

// Las operaciones se ordenan como en el funnel: las activas primero, de la que vence
// antes a la que vence despues; despues las terminadas, de la mas reciente a la mas vieja.
function pintarOps(c){
  const d=document.getElementById("f-ops"); if(!d) return;
  const todas = fOps || opsActivas(c);
  const ops=todas.slice().sort((a,b)=>{
    if(a.es_activa&&!b.es_activa) return -1;
    if(!a.es_activa&&b.es_activa) return  1;
    return a.es_activa ? ffNum(a.fecha_fin)-ffNum(b.fecha_fin) : ffNum(b.fecha_fin)-ffNum(a.fecha_fin);
  });
  const cargando = fOps===null && (c.ops_totales||0)>ops.length;
  d.innerHTML=`<div class="titulo">Operaciones (${ops.length}${cargando?" de "+c.ops_totales:""})</div>`
    + (cargando?`<div class="cargando">Buscando el resto del historial...</div>`:"")
    + (ops.length?ops.map(opCard).join(""):`<div class="vacio">Sin operaciones.</div>`);
}

function opCard(o){
  const pct=Math.min(100,Math.round((o.pct||0)*100));
  const et=ETAPAS.find(e=>e[0]===o.etapa);
  const col={inicio:"#3498DB",en_marcha:"#2471a3",por_cerrar:"var(--naranja)",
             cierre_inminente:"var(--rojo)",refinanciar:"var(--violeta)",finalizado:"#8d96a3"};
  const badge = o.cancelada_anticipada
    ? `<span class="badge" style="background:var(--verde)">Cancel&oacute; anticipado</span>`
    : (!o.es_activa&&(o.saldo_neto||0)>100
        ? `<span class="badge" style="background:var(--violeta)">Refinanciar &middot; ${plata(o.saldo_neto)}</span>`
        : `<span class="badge" style="background:${col[o.etapa]||"#8d96a3"}">${et?et[1]:esc(o.etapa||"")}</span>`);
  const reform = o.reformulada
    ? `<span class="badge" style="background:#2980B9">Reformulada${o.reform_fecha?" "+esc(o.reform_fecha):""}</span>`
    : (o.es_refinanciada?`<span class="badge" style="background:#2980B9">Reformulada</span>`:"");
  let prods=(o.productos||[]).join(", ");
  if(!prods) prods = String(o.tipo||"").toUpperCase().includes("PRESUPUESTO")
    ? "PRESUPUESTO"+((o.capital||o.total)?" - Capital: "+plata(o.capital||o.total):"")
    : (o.tipo||"(sin detalle)");
  return `<div class="opc">
    <div class="opc-h"><span class="opn">Op. #${esc(o.operacion)}</span>${badge}${reform}</div>
    <div class="loc">${esc(o.tipo||"")} | ${o.cuotas||0} cuotas | Inicio: ${esc(o.inicio||"-")} | Vence: ${esc(o.fecha_fin||"-")}</div>
    <div style="font-size:.8rem;font-weight:700;color:var(--naranja);margin-top:2px">
      Cuota: ${plata(o.cuota_semanal)}/sem | Total: ${plata(o.total||0)}</div>
    <div class="loc">${o.vendedor_op?"Vendedor: <b>"+esc(o.vendedor_op)+"</b>":""}${
      o.cobrador?" | Cobrador: <b>"+esc(o.cobrador)+"</b>":""}</div>
    <div class="avance"><div style="width:${pct}%"></div></div>
    <div class="loc">${pct}% completado - ${o.semanas_restantes||0} semanas restantes</div>
    <div class="loc" style="margin-top:3px">Productos: ${esc(prods)}</div>
    ${cuotasHtml(o.operacion)}</div>`;
}

// Detalle de cuotas de una operacion: el mismo cuadro del funnel.
function cuotasHtml(op){
  const k=String(op), q=fCuotas[k]||[];
  if(!q.length) return `<div class="loc" style="color:#aaa;margin-top:5px">Sin historial de cuotas disponible</div>`;
  const abierta=fAbiertas.has(k);
  const boton=`<button class="b auto" style="margin-top:5px;font-size:.72rem"
      onclick="toggleCuotas('${esc(k)}')">${abierta?"Ocultar cuotas":"Ver cuotas ("+q.length+")"}</button>`;
  if(!abierta) return boton;
  const pag=q.filter(x=>x.estado==="pagada"), par=q.filter(x=>x.estado==="parcial");
  const ven=q.filter(x=>x.estado==="vencida"), pen=q.filter(x=>x.estado==="pendiente");
  const cobrado=q.reduce((s,x)=>s+((x.importe||0)-(x.sal||0)),0);
  const saldo=q.reduce((s,x)=>s+(x.sal||0),0);
  const conAtraso=pag.filter(x=>x.atraso!==null&&x.atraso!==undefined);
  const atrPro=conAtraso.length?(conAtraso.reduce((s,x)=>s+x.atraso,0)/conAtraso.length).toFixed(1):"-";
  const pill=(t,c,b)=>`<span style="background:${b};color:${c};padding:2px 8px;border-radius:4px;font-weight:700">${t}</span>`;
  return boton+`<div style="margin-top:7px">
    <div style="display:flex;gap:5px;flex-wrap:wrap;font-size:.68rem;margin-bottom:6px">
      ${pill("Pagadas: "+pag.length,"#22863a","#e8f5e9")}
      ${par.length?pill("Parciales: "+par.length,"#e67e22","#fef3e2"):""}
      ${ven.length?pill("Vencidas: "+ven.length,"#c0392b","#fdecea"):""}
      ${pen.length?pill("Pendientes: "+pen.length,"#888","#f5f5f5"):""}
      ${pill("Cobrado: "+plata(cobrado),"#e67e22","#fff3e0")}
      ${saldo>0?pill("Saldo: "+plata(saldo),"#c0392b","#fdecea"):""}
      ${pill("Atraso prom: "+atrPro+"d","#555","#f0f0f0")}
    </div>
    <div style="overflow-x:auto"><table class="tcuotas">
      <tr><th>#</th><th style="text-align:right">Importe</th><th>Vencimiento</th>
          <th>Fecha pago</th><th>Atraso</th><th>Estado</th></tr>
      ${q.map(x=>{
        const ec={pagada:"#22863a",parcial:"#e67e22",vencida:"#c0392b"}[x.estado]||"#888";
        const el=x.estado==="pagada"?"Pagada":x.estado==="parcial"?"Parcial ("+plata(x.sal||0)+" pend.)"
                :x.estado==="vencida"?"VENCIDA":"Pendiente";
        const a=x.atraso;
        const at=(a===null||a===undefined)?"-":a<0?"Adelantada "+Math.abs(a)+"d":a===0?"En t&eacute;rmino":a+"d";
        const ac=(a===null||a===undefined)?"#888":a>0?"#c0392b":a<0?"#2980b9":"#22863a";
        return `<tr><td style="text-align:center;font-weight:700">${x.ncu}</td>
          <td style="text-align:right">${plata(x.importe)}</td>
          <td style="text-align:center;color:#555">${esc(x.venc||"")}</td>
          <td style="text-align:center;color:#555">${esc(x.pago||"-")}</td>
          <td style="text-align:center;color:${ac};font-weight:700">${at}</td>
          <td style="text-align:center;color:${ec};font-weight:700">${el}</td></tr>`;}).join("")}
    </table></div></div>`;
}
function toggleCuotas(k){
  if(fAbiertas.has(k)) fAbiertas.delete(k); else fAbiertas.add(k);
  const c=clientes.find(x=>String(x.codigo)===fCod); if(c) pintarOps(c);
}

// ---------- corregir datos del cliente ----------
// Lo que se carga aca NO viaja al ERP: la conexion es de solo lectura, a proposito.
// Hace dos cosas: deja el dato bueno a la vista de todos en el momento, y le crea al
// cobrador la tarea de cargarlo en DEBO, que es quien tiene el acceso y el interes
// (cobra por Mercado Pago y se comunica por WhatsApp).
let datCod=null;
function destinoDato(c){
  const cobs=(c.cobradores||[]).filter(Boolean);
  const real=cobs.find(x=>vendActivos ? vendActivos.has(x) : true);
  return real || "SUP COBRANZA";
}
function abrirDatos(cod){
  const c=clientes.find(x=>String(x.codigo)===String(cod)); if(!c) return;
  datCod=String(cod);
  const t=telDe(c), d=dirDe(c);
  document.getElementById("d-cli").textContent=c.nombre+"  (#"+cod+")";
  document.getElementById("d-dest").textContent="Le va a quedar como tarea a "+destinoDato(c)
    +" para cargarlo en el ERP.";
  document.getElementById("d-tel").value=t.valor||"";
  document.getElementById("d-dir").value=d.valor||"";
  const n=negDe(c), lista=NEGOCIOS.slice();
  if(n.valor&&!lista.includes(n.valor)) lista.unshift(n.valor);
  document.getElementById("d-neg").innerHTML='<option value="">Sin definir</option>'+
    lista.map(v=>`<option value="${esc(v)}" ${v===n.valor?"selected":""}>${esc(v)}</option>`).join("")+
    '<option value="__otro">Otro...</option>';
  document.getElementById("d-negotro").style.display="none";
  document.getElementById("d-negtxt").value="";
  document.getElementById("d-obs").value="";
  abrir("m-datos");
}
async function guardarDatos(){
  const c=clientes.find(x=>String(x.codigo)===datCod); if(!c) return;
  const telNuevo=document.getElementById("d-tel").value.trim();
  const dirNueva=document.getElementById("d-dir").value.trim();
  const nota=document.getElementById("d-obs").value.trim();
  const selNeg=document.getElementById("d-neg").value;
  const negNuevo = selNeg==="__otro"
    ? document.getElementById("d-negtxt").value.trim().toUpperCase() : selNeg;
  const cambioTel = telNuevo && soloDig(telNuevo)!==soloDig(c.telefono);
  const cambioDir = dirNueva && dirNueva.toUpperCase()!==String(c.domicilio||"").trim().toUpperCase();
  const cambioNeg = negNuevo && negNuevo!==negDe(c).valor;
  if(!cambioTel&&!cambioDir&&!cambioNeg){ alert("No cambiaste ningún dato."); return; }

  const reg={por:sesion.usuario, fecha:hoyISO()};
  if(cambioTel) reg.tel=telNuevo;
  if(cambioDir) reg.dir=dirNueva;
  if(cambioNeg) reg.neg=negNuevo;
  // Lo que ya estaba corregido no se pierde por tocar otro campo.
  const previo=correccionDe(datCod)||{};
  if(!cambioTel&&previo.tel) reg.tel=previo.tel;
  if(!cambioDir&&previo.dir) reg.dir=previo.dir;
  if(!cambioNeg&&previo.neg) reg.neg=previo.neg;
  datos[datCod]=reg;

  const ref=db.collection("funnel_calle").doc("_shared");
  const fp=new firebase.firestore.FieldPath("datos",datCod);
  ref.update(fp,reg).catch(()=>{ const o={}; o[datCod]=reg;
    ref.set({datos:o},{merge:true}).catch(()=>{}); });

  const detalle=[cambioTel?`Teléfono: ${c.telefono||"(vacío)"} → ${telNuevo}`:"",
                 cambioDir?`Dirección: ${c.domicilio||"(vacío)"} → ${dirNueva}`:"",
                 nota].filter(Boolean).join("\n");
  // El tipo de negocio no genera tarea: hay 727 clientes sin clasificar y una tarea por
  // cada uno ahogaria al cobrador. Se junta en una lista para cargar de una sola vez.
  if(!cambioTel&&!cambioDir){ cerrar("m-datos"); pintar(); return; }
  try{
    await db.collection("actividades").add({
      cliente_cod:datCod, cliente_nombre:c.nombre, provincia:c.provincia||"",
      asignado_a:destinoDato(c), asignado_tipo:"cobrador", historial_asignacion:[],
      origen_tipo:sesion.rol, origen_usuario:sesion.usuario, origen_motivo:"correccion_datos",
      tipo:"dato", fecha:hoyISO(), hora:null, observaciones:detalle,
      estado:"pendiente", resultado:null, resultado_nota:"",
      cerrada_en:null, cerrada_por:null,
      creado_en:firebase.firestore.FieldValue.serverTimestamp(),
      visto_en:null, actividad_origen_id:null });
  }catch(e){}
  cerrar("m-datos");
  pintar();
}

// ---------- actividades ----------
let actCod=null, actId=null;
function abrirAct(cod){ if(prepararAct(cod)) abrir("m-act"); }
function prepararAct(cod){
  const c=clientes.find(x=>String(x.codigo)===String(cod)); if(!c) return false;
  actCod=String(cod);
  const d=destinoDe(c);
  document.getElementById("a-tit").textContent=
    esVend()?"Agendar actividad":vista==="cob"?"Avisar al vendedor":"Asignar actividad";
  // Si el destinatario ya no entra al sistema, avisarlo aca: la actividad se guardaria
  // igual y no la veria nadie.
  const huerfano = vendActivos && d && !vendActivos.has(d);
  document.getElementById("a-cli").textContent=c.nombre+"  (#"+cod+")"+(esVend()?"":"  →  "+d)
    +(huerfano?"  ⚠ ese vendedor ya no entra al sistema: reasigná el cliente primero":"");
  document.getElementById("a-tipo").value="llamada";
  document.getElementById("a-fecha").value=hoyISO();
  document.getElementById("a-hora").value=""; document.getElementById("a-obs").value="";
  return true;
}
async function guardarAct(){
  const c=clientes.find(x=>String(x.codigo)===actCod);
  const f=document.getElementById("a-fecha").value;
  if(!f){ alert("Poné una fecha."); return; }
  const ahora=firebase.firestore.FieldValue.serverTimestamp();
  try{
    await db.collection("actividades").add({
      cliente_cod:actCod, cliente_nombre:c?c.nombre:"", provincia:c?(c.provincia||""):"",
      asignado_a:destinoDe(c||{}), asignado_tipo:"vendedor", historial_asignacion:[],
      origen_tipo:sesion.rol, origen_usuario:sesion.usuario, origen_motivo:null,
      tipo:document.getElementById("a-tipo").value, fecha:f,
      hora:document.getElementById("a-hora").value||null,
      observaciones:document.getElementById("a-obs").value||"",
      estado:"pendiente", resultado:null, resultado_nota:"",
      cerrada_en:null, cerrada_por:null, creado_en:ahora, visto_en:null, actividad_origen_id:null });
  }catch(e){}
  cerrar("m-act");
}
function abrirCierre(id){
  const a=actividades.find(x=>x.id===id); if(!a) return; actId=id;
  document.getElementById("c-cli").textContent=a.cliente_nombre;
  const lista = a.tipo==="dato" ? RES_DATO : RESULTADOS;
  document.getElementById("c-res").innerHTML='<option value="">¿Qué pasó?</option>'+
    lista.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  document.getElementById("c-nota").value=""; abrir("m-cerr");
}
async function guardarCierre(){
  const r=document.getElementById("c-res").value;
  if(!r){ alert("Elegí qué pasó."); return; }
  const a=actividades.find(x=>x.id===actId);
  try{ await db.collection("actividades").doc(actId).update({estado:"hecha",resultado:r,
    resultado_nota:document.getElementById("c-nota").value||"",
    cerrada_en:firebase.firestore.FieldValue.serverTimestamp(),cerrada_por:sesion.usuario}); }catch(e){}
  // Si el circuito sigue abierto se pide la proxima ahi mismo: si no se fuerza en este
  // momento, no se agenda nunca. Se reemplaza la ventana en vez de cerrar y abrir, para
  // que el historial no quede con una entrada de mas.
  const def=(a&&a.tipo==="dato"?RES_DATO:RESULTADOS).find(x=>x[0]===r);
  if(def&&def[2]&&a&&confirm("¿Agendar la próxima actividad para este cliente?")
     && prepararAct(a.cliente_cod)){
    reemplazar("m-cerr","m-act");
  } else {
    cerrar("m-cerr");
  }
}

// ---------- abrir y cerrar ventanas ----------
// En el celular la flecha de atras tiene que cerrar lo que este abierto, no salir de la
// app. Para eso cada ventana agrega una entrada al historial: cuando el telefono va para
// atras, consume esa entrada y nosotros cerramos la ventana en vez de dejar que se vaya.
// Si no hay nada abierto, la flecha hace lo de siempre.
let _ventanas=[];     // las abiertas, de abajo hacia arriba
let _ignorarAtras=0;  // los "atras" que disparamos nosotros al cerrar con la cruz

function abrir(id){
  const el=document.getElementById(id); if(!el) return;
  el.classList.add("on");
  _ventanas.push(id);
  history.pushState({ventana:id}, "");
}
function cerrar(id){
  const el=document.getElementById(id); if(!el) return;
  el.classList.remove("on");
  const i=_ventanas.lastIndexOf(id);
  if(i>=0){
    _ventanas.splice(i,1);
    _ignorarAtras++;
    history.back();     // saca del historial la entrada que habiamos puesto
  }
}
// Cambiar una ventana por otra sin tocar el historial: la entrada que ya estaba pasa a
// representar la nueva. Evita la carrera de cerrar y abrir en el mismo instante.
function reemplazar(viejo, nuevo){
  const a=document.getElementById(viejo), b=document.getElementById(nuevo);
  if(a) a.classList.remove("on");
  const i=_ventanas.lastIndexOf(viejo);
  if(i>=0) _ventanas[i]=nuevo; else _ventanas.push(nuevo);
  if(b) b.classList.add("on");
}
window.addEventListener("popstate", ()=>{
  if(_ignorarAtras>0){ _ignorarAtras--; return; }
  const id=_ventanas.pop();
  if(id){ const el=document.getElementById(id); if(el) el.classList.remove("on"); }
});
document.querySelectorAll(".capa").forEach(c=>c.onclick=e=>{ if(e.target===c) cerrar(c.id); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
