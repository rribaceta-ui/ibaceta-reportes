<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B4F8C">
<title>Funnel Comercial — Calle</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --azul:#1B4F8C; --naranja:#E8762C; --rojo:#C0392B; --verde:#16A085;
  --violeta:#9B59B6; --gris:#6b7280; --fondo:#f3f5f7; --borde:#e3e6ea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;background:var(--fondo);color:#1f2937;font-size:15px}
button,select,input,textarea{font-family:inherit;font-size:15px}

#login{position:fixed;inset:0;background:var(--azul);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
#login .caja{background:#fff;border-radius:14px;padding:26px 22px;width:100%;max-width:360px}
#login h1{margin:0 0 4px;font-size:1.15rem;color:var(--azul)}
#login p{margin:0 0 18px;font-size:.82rem;color:var(--gris)}
#login input{width:100%;padding:12px;border:1.5px solid #ccd2d9;border-radius:8px;margin-bottom:10px}
#login button{width:100%;padding:13px;background:var(--azul);color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}
#login .error{color:var(--rojo);font-size:.82rem;margin-top:10px;display:none}

header{background:var(--azul);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:25}
header .tit{flex:1;min-width:0}
header .t1{font-weight:700;font-size:.95rem;line-height:1.15}
header .t2{font-size:.71rem;opacity:.82}
header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:6px;padding:7px 11px;font-size:.76rem;cursor:pointer}
nav{display:flex;background:#fff;border-bottom:1px solid var(--borde);position:sticky;top:50px;z-index:24;overflow-x:auto}
nav button{flex:1 0 auto;padding:11px 14px;background:none;border:0;border-bottom:3px solid transparent;color:var(--gris);font-weight:600;font-size:.82rem;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--azul);border-bottom-color:var(--azul)}
nav .pin{display:inline-block;min-width:17px;padding:0 5px;margin-left:4px;background:var(--naranja);color:#fff;border-radius:9px;font-size:.68rem;line-height:17px}

.barra{padding:10px 14px;background:#fff;border-bottom:1px solid var(--borde);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.barra select,.barra input{padding:8px 12px;border:1.5px solid #ccd2d9;border-radius:18px;font-size:.84rem;min-width:0}
.barra select{flex:1;max-width:300px}
.barra input{flex:1;min-width:150px}

/* KPIs, igual que el funnel */
.kpis{display:flex;gap:9px;overflow-x:auto;padding:12px 14px 4px}
.kpi{flex:0 0 auto;min-width:118px;background:#fff;border:1px solid var(--borde);border-top:3px solid var(--naranja);border-radius:9px;padding:9px 13px}
.kpi .l{font-size:.64rem;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:1.3rem;font-weight:800;color:#111;line-height:1.15}

/* Columnas del funnel */
.cols{display:flex;gap:11px;overflow-x:auto;padding:12px 14px 28px;-webkit-overflow-scrolling:touch;align-items:flex-start}
/* En pantalla ancha las seis columnas se reparten el espacio y entran todas, como en
   el funnel. En telefono cada una ocupa casi toda la pantalla y se desliza al costado. */
.col{flex:1 1 0;min-width:168px;background:#eef1f4;border-radius:10px;overflow:hidden}
@media(max-width:900px){ .col{flex:0 0 82vw;min-width:0} }
.col-h{padding:9px 10px;text-align:center;color:#fff}
.col-h .t{font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.col-h .n{font-size:1.45rem;font-weight:800;line-height:1.1}
.col-h .r{font-size:.62rem;opacity:.9}
.col-b{padding:9px;max-height:none}
.c-inicio .col-h{background:#3498DB}.c-en_marcha .col-h{background:#2471a3}
.c-por_cerrar .col-h{background:var(--naranja)}.c-cierre_inminente .col-h{background:var(--rojo)}
.c-refinanciar .col-h{background:var(--violeta)}.c-finalizado .col-h{background:#8d96a3}

.tar{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:10px;margin-bottom:8px}
.tar .nom{font-weight:700;font-size:.87rem;line-height:1.25;color:var(--azul)}
.tar .loc{font-size:.74rem;color:var(--gris);margin-top:1px}
.tar .cu{font-size:.8rem;color:var(--naranja);font-weight:700;margin-top:4px}
.tar .de{font-size:.74rem;color:#444;margin-top:2px}
.tar .te{font-size:.74rem;margin-top:3px}
.b{display:block;width:100%;margin-top:6px;padding:7px;border-radius:6px;border:1.5px solid var(--azul);background:#fff;color:var(--azul);font-size:.76rem;font-weight:700;cursor:pointer}
.b.full{background:var(--azul);color:#fff}
.b.verde{border-color:var(--verde);color:var(--verde)}.b.verde.full{background:var(--verde);color:#fff}
.b.auto{display:inline-block;width:auto;margin:0 6px 0 0;padding:7px 13px}
a.tel{color:var(--azul);text-decoration:none;font-weight:600}
.badge{display:inline-block;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:9px;color:#fff;margin:0 3px 3px 0}
.chip{display:inline-block;font-size:.69rem;font-weight:700;padding:3px 7px;border-radius:9px;background:#eef1f4;color:#555;margin-top:5px}
.chip.venc{background:#fdecea;color:var(--rojo)}.chip.hoy{background:#fdf0e3;color:#b35309}
.sel-tag{width:100%;margin-top:6px;padding:6px;border:1.5px solid #ccd2d9;border-radius:6px;font-size:.74rem;color:#555;background:#fafbfc}
.chip.prox{background:#eaf2fb;color:#1f6fb2}.chip.sin{background:#f4f4f4;color:#9ca3af;font-style:italic;font-weight:500}

.panel{margin:12px 14px;background:#fff;border:1px solid var(--borde);border-radius:10px;padding:13px}
.panel h3{margin:0 0 9px;font-size:.92rem}
.titulo{font-weight:700;font-size:.8rem;margin:11px 0 6px;color:#374151}
.act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--borde);border-radius:7px;padding:8px 10px;margin-bottom:6px;font-size:.81rem}
.act.venc{border-left:4px solid var(--rojo)}.act.hoy{border-left:4px solid var(--naranja)}
.act.prox{border-left:4px solid #3498DB}
.tabla{width:100%;border-collapse:collapse;font-size:.8rem}
.tabla th{text-align:left;background:var(--azul);color:#fff;padding:7px 9px;font-size:.72rem;white-space:nowrap}
.tabla td{padding:7px 9px;border-bottom:1px solid #eee}
.tabla tr{cursor:pointer}
.vacio{text-align:center;color:#9ca3af;font-size:.85rem;padding:26px 10px}
.cargando{text-align:center;padding:40px;color:var(--gris)}

.capa{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
.capa.on{display:flex}
.hoja{background:#fff;width:100%;max-width:540px;border-radius:14px 14px 0 0;max-height:88vh;overflow-y:auto;padding:18px}
@media(min-width:560px){.capa{align-items:center}.hoja{border-radius:14px}}
.hoja h2{margin:0 0 3px;font-size:1.02rem}
.hoja .cierra{float:right;background:none;border:0;font-size:1.4rem;color:#9ca3af;cursor:pointer;line-height:1}
.campo{margin-bottom:11px}
.campo label{display:block;font-size:.77rem;font-weight:700;margin-bottom:4px;color:#374151}
.campo input,.campo select,.campo textarea{width:100%;padding:10px;border:1.5px solid #ccd2d9;border-radius:7px}
.acciones{display:flex;gap:9px;justify-content:flex-end;margin-top:15px}
</style>
</head>
<body>

<div id="login">
  <div class="caja">
    <h1>Funnel Comercial — Calle</h1>
    <p>Entrá con tu usuario y contraseña de siempre.</p>
    <div id="ver" style="font-size:.68rem;color:#9ca3af;margin:-12px 0 12px"></div>
    <input id="lu" placeholder="Usuario" autocapitalize="characters" autocomplete="username"
           autocorrect="off" spellcheck="false">
    <input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false">
    <label style="display:flex;align-items:center;gap:7px;font-size:.8rem;color:#6b7280;margin:-2px 0 12px;cursor:pointer">
      <input type="checkbox" id="ojo" onchange="verClave()" style="width:auto;margin:0"> Ver contraseña
    </label>
    <button id="lb">Entrar</button>
    <div class="error" id="le"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="tit"><div class="t1">Funnel Comercial — Calle</div><div class="t2" id="hsub"></div></div>
    <button onclick="salir()">Salir</button>
  </header>
  <nav id="nav"></nav>
  <div id="barra" class="barra" style="display:none"></div>
  <div class="kpis" id="kpis"></div>
  <div id="panel"></div>
  <div class="cols" id="cols"></div>
  <div id="tabla"></div>
</div>

<div class="capa" id="m-ficha"><div class="hoja">
  <button class="cierra" onclick="cerrar('m-ficha')">&times;</button>
  <h2 id="f-nom"></h2><div id="f-cuerpo"></div>
</div></div>

<div class="capa" id="m-act"><div class="hoja">
  <button class="cierra" onclick="cerrar('m-act')">&times;</button>
  <h2 id="a-tit">Agendar actividad</h2>
  <div id="a-cli" style="font-size:.83rem;color:var(--gris);margin-bottom:12px"></div>
  <div class="campo"><label>Acción</label><select id="a-tipo">
    <option value="llamada">Llamada</option><option value="visita">Visita</option>
    <option value="whatsapp">WhatsApp</option><option value="tarea">Tarea</option></select></div>
  <div class="campo"><label>Fecha</label><input type="date" id="a-fecha"></div>
  <div class="campo"><label>Hora (opcional)</label><input type="time" id="a-hora"></div>
  <div class="campo"><label>Observaciones</label><textarea id="a-obs" rows="3"></textarea></div>
  <div class="acciones"><button class="b auto" onclick="cerrar('m-act')">Cancelar</button>
    <button class="b auto full" onclick="guardarAct()">Guardar</button></div>
</div></div>

<div class="capa" id="m-cerr"><div class="hoja">
  <button class="cierra" onclick="cerrar('m-cerr')">&times;</button>
  <h2>¿Qué pasó?</h2>
  <div id="c-cli" style="font-size:.83rem;color:var(--gris);margin-bottom:12px"></div>
  <div class="campo"><label>Resultado</label><select id="c-res"></select></div>
  <div class="campo"><label>Nota (opcional)</label><textarea id="c-nota" rows="3"></textarea></div>
  <div class="acciones"><button class="b auto" onclick="cerrar('m-cerr')">Cancelar</button>
    <button class="b auto full" onclick="guardarCierre()">Guardar</button></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyDw5qyz5bR5zOD-JxH2dbSUuafOiHgFovc",
  authDomain:"ibaceta-funnel.firebaseapp.com",
  projectId:"ibaceta-funnel",
  storageBucket:"ibaceta-funnel.firebasestorage.app",
  messagingSenderId:"887640429368",
  appId:"1:887640429368:web:4c732bf5eace6a7498e7cd"
});
const db = firebase.firestore();
// Deja los datos en el telefono: abre y funciona sin señal, que es donde trabajan los
// vendedores. Lo hecho sin conexion sincroniza al volver.
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

const VERSION="2026-10-09j";
const DOMINIO="funnel.ibaceta.ar";
const TIPOS={llamada:"Llamada",visita:"Visita",whatsapp:"WhatsApp",tarea:"Tarea"};
const RESULTADOS=[["contactado_interesado","Contactado - interesado",true],
  ["contactado_no_ahora","Contactado - no ahora",true],["no_contactado","No contactó",true],
  ["no_interesa","No le interesa",false],["vendido","Vendido",false],
  ["datos_erroneos","Datos erróneos (tel/dir)",false]];
// Mismas etapas, mismos nombres y mismo orden que el funnel de siempre.
const TAGS=[["sin_local","Ya no tiene local","#E8762C"],
            ["incobrable","Incobrable","#C0392B"],
            ["fallecido","Fallecido","#7F8C8D"]];
// Las etiquetas viven en el MISMO documento que usa el funnel HTML (funnel_calle/_shared).
// Asi lo que se marca en la app se ve en el tablero viejo y al reves, que es lo que hace
// falta mientras los dos conviven.
let tags={}, asignaciones={};
const ETAPAS=[["inicio","Inicio","0% - 50%"],["en_marcha","En marcha","50% - 75%"],
  ["por_cerrar","Por cerrar","75% - 90%"],["cierre_inminente","Cierre inminente","90% - 100%"],
  ["refinanciar","Refinanciar","Saldo > 0"],["finalizado","Finalizado","> 100%"]];

let sesion=null, clientes=[], actividades=[], desus=[];
// Un vendedor recibe clientes por dos vias: los que el ERP le asigna y los que le
// reasignaron a mano. Firestore no deja preguntar por las dos condiciones en una sola
// consulta, asi que son dos escuchas y aca se unen sin repetir.
let _cliErp=[], _cliAsig=[];
function _fusionarClientes(){
  const vistos=new Set(); clientes=[];
  for(const c of _cliErp.concat(_cliAsig)){
    const k=String(c.codigo);
    if(!vistos.has(k)){ vistos.add(k); clientes.push(c); }
  }
}
let vista="sup", selVend="", selCob="", busca="";
let fProv="", fDepto="", fDiv="", fTipo="", soloEtiquetados=false;
// "Huerfano" = cliente activo cuyo vendedor ya no esta entre los que pueden entrar al
// sistema. La lista la escribe el sincronizador; si todavia no existe, no se filtra
// nada en vez de inventar un criterio.
let vendActivos=null, vendPorDiv={};

const hoyISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const dmy=i=>{if(!i)return"";const p=String(i).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:i;};
const plata=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const correo=u=>u.trim().toLowerCase().replace(/[^a-z0-9]+/g,".").replace(/^\.|\.$/g,"")+"@"+DOMINIO;
// Los telefonos del ERP vienen pegados, con punto y coma, con 54/549 adelante o con
// varios numeros en un mismo campo. Partirlos por espacios -- como hacia antes -- los
// rompia en pedazos ("+54 · 9 · 261 · 270 · 0889"). Misma logica que el funnel.
function tel(raw){
  if(!raw) return "";
  const partes=String(raw).split(/[;,\n\r]|  +/).map(x=>x.trim()).filter(Boolean);
  const links=[];
  partes.forEach(parte=>{
    let d=parte.replace(/\D/g,"");
    if(d.startsWith("549")&&d.length===13) d=d.slice(3);
    else if(d.startsWith("54")&&d.length===12) d=d.slice(2);
    else if(d.startsWith("0")) d=d.slice(1);
    if(d.length<7) return;
    const trozos = d.length>13 ? (d.match(/.{1,10}/g)||[d]) : [d];
    trozos.forEach(c=>{
      if(c.length<7) return;
      links.push(`<a class="tel" href="tel:${c}">${c}</a>` +
        (c.length===10 ? ` <a class="tel" style="opacity:.65" target="_blank"
           href="https://wa.me/549${c}">wa</a>` : ""));
    });
  });
  return [...new Set(links)].join(" · ");
}
const esVend=()=>sesion&&sesion.rol==="vendedor";
const esCob=()=>sesion&&sesion.rol==="cobrador";
const conduce=()=>sesion&&["gerente","supervisor_zona","supervisor_cobranza"].includes(sesion.rol);

// ---------- acceso ----------
function verClave(){
  document.getElementById("lp").type =
    document.getElementById("ojo").checked ? "text" : "password";
}
document.getElementById("ver").textContent="versión "+VERSION;
document.getElementById("lb").onclick=entrar;
document.getElementById("lp").onkeydown=e=>{if(e.key==="Enter")entrar();};
async function entrar(){
  const u=document.getElementById("lu").value.trim(),p=document.getElementById("lp").value,err=document.getElementById("le");
  if(!u||!p){err.textContent="Completá usuario y contraseña.";err.style.display="block";return;}
  document.getElementById("lb").disabled=true;
  try{ await firebase.auth().signInWithEmailAndPassword(correo(u),p); }
  catch(e){ const c=e.code||"";
    let t;
    if(c.includes("user-not-found"))            t="Ese usuario no existe. Revisá cómo lo escribís.";
    else if(c.includes("wrong-password"))       t="La contraseña no coincide.";
    else if(c.includes("invalid-credential"))   t="Usuario o contraseña incorrectos.";
    else if(c.includes("too-many-requests"))    t="Demasiados intentos. Esperá unos minutos.";
    else if(c.includes("network"))              t="Sin conexión con el servidor.";
    else if(c.includes("invalid-email"))        t="El usuario tiene caracteres que no se admiten.";
    else                                        t="No se pudo entrar: "+(e.message||c);
    err.innerHTML = t + `<div style="margin-top:6px;font-size:.72rem;color:#9ca3af">
      usuario probado: ${esc(correo(u))} · versión ${VERSION} · código ${esc(c||"sin código")}</div>`;
    err.style.display="block"; document.getElementById("lb").disabled=false; }
}
function salir(){ desus.forEach(f=>f&&f()); desus=[]; firebase.auth().signOut().then(()=>location.reload()); }

firebase.auth().onAuthStateChanged(async u=>{
  if(!u) return;
  const t=await u.getIdTokenResult();
  sesion={usuario:t.claims.usuario,rol:t.claims.rol,zona:t.claims.zona||"",division:t.claims.division||""};
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("hsub").textContent=sesion.usuario+" · "+(sesion.rol||"").replace(/_/g," ")+(sesion.zona?" · "+sesion.zona:"");
  vista = esVend()?"vend" : (esCob()?"cob":"sup");
  if(esVend()) selVend=sesion.usuario;
  if(esCob())  selCob=sesion.usuario;
  pintarNav();
  document.getElementById("cols").innerHTML='<div class="cargando">Cargando cartera...</div>';
  escuchar();
});

// ---------- datos ----------
function escuchar(){
  let q=db.collection("clientes");
  if(esVend())      q=q.where("vendedor","==",sesion.usuario);
  else if(esCob())  q=q.where("cobradores","array-contains",sesion.usuario);
  else if(sesion.rol==="supervisor_zona") q=q.where("provincia","==",sesion.zona);
  desus.push(q.onSnapshot(s=>{_cliErp=s.docs.map(d=>d.data());_fusionarClientes();pintar();},
    e=>{document.getElementById("cols").innerHTML='<div class="vacio">No se pudo traer la cartera.<br><small>'+esc(e.message)+'</small></div>';}));

  // Los clientes que le reasignaron. El ERP no registra la reasignacion: queda en el
  // documento compartido y el sincronizador la copia a cada cliente como vendedor_asig.
  // Sin esta segunda escucha, el vendedor nunca veria lo que le dieron.
  if(esVend()){
    desus.push(db.collection("clientes").where("vendedor_asig","==",sesion.usuario)
      .onSnapshot(s=>{_cliAsig=s.docs.map(d=>d.data());_fusionarClientes();pintar();},()=>{}));
  }
  let qa=db.collection("actividades");
  if(esVend()) qa=qa.where("asignado_a","==",sesion.usuario);
  desus.push(qa.onSnapshot(s=>{actividades=s.docs.map(d=>({id:d.id,...d.data()}));pintar();},()=>{}));

  db.collection("config").doc("vendedores_activos").get()
    .then(d=>{ if(d.exists){ vendActivos=new Set(d.data().usuarios||[]);
                             vendPorDiv=d.data().por_division||{}; pintar(); } })
    .catch(()=>{});

  desus.push(db.collection("funnel_calle").doc("_shared").onSnapshot(d=>{
    tags = (d.exists && d.data().tags) ? d.data().tags : {};
    // Las reasignaciones se comparten con el funnel HTML: si el supervisor mueve un
    // cliente en un lado, el otro lo ve. Dos listas separadas se desfasarian.
    asignaciones = (d.exists && d.data().asignaciones) ? d.data().asignaciones : {};
    pintar();
  },()=>{}));
}

// ---------- clasificacion, igual que el funnel ----------
function opsActivas(c){ return (c.operaciones||[]).filter(o=>o.es_activa); }
function esRefinanciar(c){ const r=c.resumen_fin||{}; return !opsActivas(c).length && !!r.saldo_pend; }
function etapaDe(c){
  if(esRefinanciar(c)) return "refinanciar";
  const a=opsActivas(c); if(!a.length) return "finalizado";
  for(const e of ["cierre_inminente","por_cerrar","en_marcha","inicio"]) if(a.some(o=>o.etapa===e)) return e;
  return "inicio";
}
const tagDe=cod=>tags[String(cod)]||null;
// De quien es un cliente. Una reasignacion manual manda sobre el ERP: si al cliente lo
// pasaron a otro vendedor, deja de contar para el anterior. Una sola definicion para las
// tres vistas; antes cada pantalla la resolvia por su cuenta y no coincidian.
function esDe(c,u){
  const a = asignaciones[String(c.codigo)] || c.vendedor_asig;
  if(a) return a===u;
  return (c.vendedores||[]).includes(u) || c.vendedor===u;
}
// El vendedor que vale es el reasignado a mano; si no hay, el del ERP.
function vendedorDe(c){
  const a = asignaciones[String(c.codigo)] || c.vendedor_asig;
  return a || c.vendedor || (c.vendedores||[])[0] || "";
}
function asignarA(cod, usuario){
  const ref=db.collection("funnel_calle").doc("_shared");
  const fp=new firebase.firestore.FieldPath("asignaciones",String(cod));
  // 1) El documento compartido es la fuente: lo lee el funnel HTML y de ahi lo toma el
  //    sincronizador en cada corrida.
  const dato = usuario ? usuario : firebase.firestore.FieldValue.delete();
  ref.update(fp,dato).catch(()=>{ if(usuario){ const o={}; o[String(cod)]=usuario;
    ref.set({asignaciones:o},{merge:true}).catch(()=>{}); } });
  // 2) Y se copia al cliente y a su historial para que el vendedor nuevo lo vea en el
  //    acto, sin esperar la corrida de la noche. Las reglas solo dejan tocar ese campo.
  //    Si estas escrituras fallan, el sincronizador las rehace igual desde el documento
  //    compartido: la asignacion no se pierde, se ve mas tarde.
  const marca={vendedor_asig: usuario ? usuario : firebase.firestore.FieldValue.delete()};
  ["clientes","historial"].forEach(col=>{
    db.collection(col).doc(String(cod)).update(marca)
      .catch(e=>console.warn("Reasignacion guardada; el vendedor la vera despues de la "
                             +"sincronizacion ("+col+"):", e.message));
  });
}

// Misma regla que el funnel: huerfano es el cliente que quedo SIN DIVISION, que es lo
// que pasa cuando su vendedor no esta en el mapeo de activos (se fue, o nunca se cargo).
// Antes se miraba si el vendedor estaba en la lista de logins, y esa lista incluye
// cobradores y gerencia: la tabla quedaba vacia o con otra gente que la del funnel.
// Si ya fue reasignado a mano, deja de estar huerfano.
// El reasignado NO sale de la tabla: en el funnel queda listado y marcado en verde,
// para que se vea quien lo tomo y se pueda corregir.
function esHuerfano(c){ return !c.division; }
// Vendedores a ofrecer: los de la division de origen del cliente. Si no se pudo inferir
// la division, se ofrecen todos los activos antes que dejar el selector vacio.
function vendsParaHuerfano(c){
  const divs=c.div_huerf||[];
  const out=[];
  divs.forEach(d=>(vendPorDiv[d]||[]).forEach(v=>{ if(!out.includes(v)) out.push(v); }));
  if(out.length) return out.sort();
  return Object.values(vendPorDiv).flat().filter((v,i,a)=>a.indexOf(v)===i).sort();
}
function ponerTag(cod,val){
  const ref=db.collection("funnel_calle").doc("_shared");
  const fp=new firebase.firestore.FieldPath("tags",String(cod));
  // Para quitar se borra la clave: escribir el mapa entero con merge nunca borra nada
  // y hace reaparecer lo que alguien habia sacado.
  const dato = val ? val : firebase.firestore.FieldValue.delete();
  ref.update(fp,dato).catch(()=>{ if(val){ const o={}; o[String(cod)]=val;
    ref.set({tags:o},{merge:true}).catch(()=>{}); } });
}
const pend=()=>actividades.filter(a=>a.estado==="pendiente");
function proxDe(cod){ const l=pend().filter(a=>String(a.cliente_cod)===String(cod))
  .sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")); return l[0]||null; }

// A quien le corresponde la actividad que se crea desde una tarjeta.
// A quien le queda la actividad. Siempre un vendedor: es el que va a ver al cliente.
// Usa el vendedor EFECTIVO, asi un cliente reasignado le llega al que lo tomo y no al
// que ya no esta.
function destinoDe(c){
  if(esVend()) return sesion.usuario;
  if(vista==="vend"&&selVend) return selVend;
  return vendedorDe(c)||sesion.usuario;
}

// ---------- navegacion ----------
function pintarNav(){
  const n=document.getElementById("nav"); let h="";
  if(conduce()) h+=`<button data-v="sup" onclick="irA('sup')">Vista Supervisor</button>`;
  if(conduce()||esVend()) h+=`<button data-v="vend" onclick="irA('vend')">Vista Vendedor<span class="pin" id="pin" style="display:none">0</span></button>`;
  if(conduce()||esCob())  h+=`<button data-v="cob" onclick="irA('cob')">Vista Cobrador</button>`;
  n.innerHTML=h; marcarNav();
}
function marcarNav(){ document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===vista)); }
function irA(v){ vista=v; marcarNav(); pintar(); window.scrollTo(0,0); }

// ---------- pintado ----------
function pintar(){
  const n=pend().length, p=document.getElementById("pin");
  if(p){ p.textContent=n; p.style.display=n?"inline-block":"none"; }
  pintarBarra();
  if(vista==="sup") pintarSupervisor(); else pintarKanban();
}

function pintarBarra(){
  const b=document.getElementById("barra");
  b.style.display="flex";
  const fijo = vista==="sup" || (vista==="vend"&&esVend())||(vista==="cob"&&esCob());
  let h="";
  if(!fijo){
    const campo = vista==="vend" ? "vendedores" : "cobradores";
    const set=new Set(); clientes.forEach(c=>(c[campo]||[]).forEach(x=>x&&set.add(x)));
    if(vista==="vend") clientes.forEach(c=>c.vendedor&&set.add(c.vendedor));
    const sel = vista==="vend"?selVend:selCob;
    h+=`<select onchange="elegir(this.value)"><option value="">Seleccionar ${vista==="vend"?"vendedor":"cobrador"}...</option>`+
       [...set].sort().map(v=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(v)}</option>`).join("")+`</select>`;
  }
  h+=`<input placeholder="Buscar por nombre..." value="${esc(busca)}" oninput="busca=this.value;pintar()">`;

  const divs=[...new Set(clientes.map(c=>c.division).filter(Boolean))].sort();
  if(divs.length>1){
    h+=`<select onchange="fDiv=this.value;fProv='';fDepto='';pintar()"><option value="">Todas las divisiones</option>`+
       divs.map(v=>`<option value="${esc(v)}" ${v===fDiv?"selected":""}>${esc(v)}</option>`).join("")+`</select>`;
  }

  // Provincia y departamento: el funnel los tiene y sirven para armar el recorrido.
  const base=baseDe().filter(c=>!fDiv||c.division===fDiv);
  const provs=[...new Set(base.map(c=>c.provincia).filter(Boolean))].sort();
  if(provs.length>1){
    h+=`<select onchange="fProv=this.value;fDepto='';pintar()"><option value="">Toda provincia</option>`+
       provs.map(v=>`<option value="${esc(v)}" ${v===fProv?"selected":""}>${esc(v)}</option>`).join("")+`</select>`;
  }
  const deptos=[...new Set(base.filter(c=>!fProv||c.provincia===fProv).map(c=>c.depto).filter(Boolean))].sort();
  if(deptos.length>1){
    h+=`<select onchange="fDepto=this.value;pintarKanban()"><option value="">Todo departamento</option>`+
       deptos.map(v=>`<option value="${esc(v)}" ${v===fDepto?"selected":""}>${esc(v)}</option>`).join("")+`</select>`;
  }
  const tipos=[...new Set(base.flatMap(c=>(c.operaciones||[]).map(o=>o.tipo)).filter(Boolean))].sort();
  if(tipos.length>1){
    h+=`<select onchange="fTipo=this.value;pintar()"><option value="">Todas las operaciones</option>`+
       tipos.map(v=>`<option value="${esc(v)}" ${v===fTipo?"selected":""}>${esc(v)}</option>`).join("")+`</select>`;
  }
  h+=`<label style="display:flex;align-items:center;gap:6px;font-size:.8rem;color:#555">
        <input type="checkbox" ${soloEtiquetados?"checked":""}
               onchange="soloEtiquetados=this.checked;pintar()" style="width:auto"> Solo etiquetados</label>`;
  b.innerHTML=h;
}
function elegir(v){ if(vista==="vend") selVend=v; else selCob=v; pintar(); }

// Mismos filtros para las tres vistas: division, provincia, departamento, tipo de
// operacion, etiquetados y buscador. En el funnel estaban en la vista supervisor y
// faltaban aca.
function filtrar(l){
  if(fDiv)   l=l.filter(c=>c.division===fDiv);
  if(fProv)  l=l.filter(c=>c.provincia===fProv);
  if(fDepto) l=l.filter(c=>c.depto===fDepto);
  if(fTipo)  l=l.filter(c=>(c.operaciones||[]).some(o=>o.tipo===fTipo));
  if(soloEtiquetados) l=l.filter(c=>!!tagDe(c.codigo));
  if(busca){ const q=busca.trim().toLowerCase();
             l=l.filter(c=>(c.nombre||"").toLowerCase().includes(q)); }
  return l;
}

function baseDe(){
  const q = vista==="vend" ? (esVend()?sesion.usuario:selVend) : (esCob()?sesion.usuario:selCob);
  if(!q) return clientes;
  return vista==="vend"
    ? clientes.filter(c=>esDe(c,q))
    : clientes.filter(c=>(c.cobradores||[]).includes(q));
}

// ---------- Vista Supervisor ----------
function pintarSupervisor(){
  document.getElementById("panel").innerHTML="";
  const lista=filtrar(clientes);   // respeta division/provincia/tipo/busqueda
  const act=lista.filter(c=>c.estado==="activo");
  const opsA=act.flatMap(opsActivas);
  const cie=act.filter(c=>opsActivas(c).some(o=>o.etapa==="cierre_inminente"));
  const fin=lista.filter(c=>c.estado!=="activo");
  kpis([["Clientes activos",act.length],["Operaciones activas",opsA.length],
        ["Cierre inminente",cie.length],["Finalizados sin renovar",fin.length],
        ["Cuota total/sem",plata(opsA.reduce((s,o)=>s+(o.cuota_semanal||0),0))]]);

  const por={};
  ETAPAS.forEach(([k])=>por[k]=0);
  lista.forEach(c=>{ const e=etapaDe(c); if(por[e]!==undefined) por[e]++; });
  document.getElementById("cols").innerHTML = ETAPAS.map(([k,l,r])=>`
    <div class="col c-${k}" style="flex:0 0 150px"><div class="col-h">
      <div class="t">${l}</div><div class="n">${por[k]}</div><div class="r">${r}</div></div></div>`).join("");

  // Tabla de vendedores. Igual que el funnel: un huerfano sin reasignar NO suma a
  // ningun vendedor -- su vendedor nativo ya no esta activo y el cliente pertenece a la
  // cartera huerfana, no a esta tabla. La columna "Sin agendar" es el agregado de la
  // app: es el numero que dispara el trabajo del dia.
  const conAct=new Set(pend().map(a=>String(a.cliente_cod)));
  const porV={};
  lista.forEach(c=>{
    const v = asignaciones[String(c.codigo)] || c.vendedor_asig
              || (c.division ? vendedorDe(c) : "");
    if(!v) return;
    const r=porV[v]||(porV[v]={v,div:c.division||"",act:0,ops:0,cie:0,fin:0,sin:0,cuotas:[]});
    if(!r.div && c.division) r.div=c.division;
    if(c.estado==="activo"){
      r.act++; const oa=opsActivas(c); r.ops+=oa.length;
      oa.forEach(o=>{ if(o.cuota_semanal>0) r.cuotas.push(o.cuota_semanal); });
      if(oa.some(o=>o.etapa==="cierre_inminente")) r.cie++;
      if(!conAct.has(String(c.codigo))) r.sin++;
    } else r.fin++;
  });
  const prom=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
  const filas=Object.values(porV).filter(r=>r.act>0).sort((a,b)=>b.act-a.act);
  // ---- Tabla por departamento ----
  // Mismos criterios que el funnel: agrupa por departamento (no por departamento+
  // division), deja afuera a los huerfanos, ordena alfabeticamente y la cuota es el
  // PROMEDIO de las cuotas semanales activas, no el total repartido entre clientes.
  const porD={};
  lista.filter(c=>c.division).forEach(c=>{
    const k=c.depto||"Sin departamento";
    const r=porD[k]||(porD[k]={depto:k,div:c.division||"",act:0,ops:0,cie:0,fin:0,cuotas:[]});
    if(c.estado==="activo"){
      r.act++; const oa=opsActivas(c); r.ops+=oa.length;
      oa.forEach(o=>{ if(o.cuota_semanal>0) r.cuotas.push(o.cuota_semanal); });
      if(oa.some(o=>o.etapa==="cierre_inminente")) r.cie++;
    } else r.fin++;
  });
  const deptoHtml=`<div class="panel"><h3>Tabla por departamento (${Object.keys(porD).length})</h3>
    <div style="overflow-x:auto"><table class="tabla">
      <tr><th>Departamento</th><th>División</th><th>Activos</th><th>Ops activas</th>
          <th>Cierre inminente</th><th>Final. sin renovar</th><th>Cuota prom.</th></tr>
      ${Object.values(porD).sort((a,b)=>a.depto.localeCompare(b.depto,"es"))
        .map(r=>`<tr><td style="font-weight:700">${esc(r.depto)}</td><td>${esc(r.div)}</td>
          <td>${r.act}</td><td>${r.ops}</td><td>${r.cie}</td><td>${r.fin}</td>
          <td>${plata(prom(r.cuotas))}</td></tr>`).join("")}
    </table></div></div>`;

  // ---- Cartera huerfana: tabla con asignacion, como el funnel ----
  // Mas reciente primero: con 3.000 registros, los que valen la pena trabajar son los
  // que compraron ultimo. Antes salian en el orden en que vinieron de la base.
  const anioDe=c=>{ const f=c.ultima_op_fecha||""; return f.length===10?+f.slice(6):0; };
  const huerf=lista.filter(c=>esHuerfano(c)).sort((a,b)=>anioDe(b)-anioDe(a));
  const huerfHtml = huerf.length ? `<div class="panel">
      <h3>Cartera huérfana (${huerf.length} registros)</h3>
      <div style="font-size:.78rem;color:var(--gris);margin-bottom:8px">
        Clientes que quedaron sin vendedor asignado. Al asignarlos, el cambio se ve
        también en el funnel. Ordenados por operación más reciente.</div>
      <div style="overflow-x:auto"><table class="tabla">
        <tr><th>Cliente</th><th>Vendedor original</th><th>División</th><th>Localidad / Zona</th>
            <th>Última operación</th><th>Fecha fin</th><th>Estado</th><th>Asignar a</th></tr>
        ${huerf.slice(0,200).map(c=>{ const asig=asignaciones[String(c.codigo)]||c.vendedor_asig||"";
          return `<tr>
          <td style="color:var(--azul);font-weight:700;cursor:pointer" onclick="ficha('${esc(c.codigo)}')">${esc(c.nombre)}</td>
          <td style="color:var(--gris)">${esc(c.vendedor||"(sin vendedor)")}</td>
          <td>${esc((c.div_huerf||[]).filter(Boolean).join(", ")||"—")}</td>
          <td>${esc(c.localidad||"—")}<div style="font-size:.7rem;color:var(--gris)">${esc(c.depto||"")}</div></td>
          <td>${esc(c.ultima_op_fecha||"—")}</td><td>${esc(c.ultima_op_fin||"—")}</td>
          <td><span class="chip">${esc(c.estado)}</span></td>
          <td><select onchange="asignarA('${esc(c.codigo)}',this.value)" style="padding:5px;border-radius:5px;font-size:.76rem;border:1.5px solid ${asig?"#27ae60":"#ccd2d9"};background:${asig?"#f0fff4":"#fff"}">
            <option value="">— Asignar a… —</option>
            ${vendsParaHuerfano(c).map(v=>`<option value="${esc(v)}" ${v===asig?"selected":""}>${esc(v)}</option>`).join("")}
          </select></td></tr>`;}).join("")}
      </table></div>
      ${huerf.length>200?`<div class="vacio">Mostrando los 200 más recientes de ${huerf.length}. Usá los filtros de arriba.</div>`:""}
    </div>` : "";
  document.getElementById("tabla").innerHTML = `<div class="panel">
    <h3>Vendedores (${filas.length})</h3>
    <div style="overflow-x:auto"><table class="tabla">
      <tr><th>Vendedor</th><th>División</th><th>Activos</th><th>Ops activas</th><th>Cierre inminente</th>
          <th>Final. sin renovar</th><th>Sin agendar</th><th>Cuota prom.</th></tr>
      ${filas.map(r=>`<tr onclick="verVend('${esc(r.v)}')">
        <td style="color:var(--azul);font-weight:700">${esc(r.v)}</td>
        <td>${esc(r.div||"—")}</td>
        <td>${r.act}</td><td>${r.ops}</td><td>${r.cie}</td><td>${r.fin}</td>
        <td style="color:${r.sin?'var(--rojo)':'inherit'};font-weight:700">${r.sin}</td>
        <td>${plata(prom(r.cuotas))}</td></tr>`).join("")}
    </table></div></div>` + deptoHtml + huerfHtml;
}
function verVend(v){ selVend=v; vista="vend"; marcarNav(); pintar(); window.scrollTo(0,0); }
function kpis(l){ document.getElementById("kpis").innerHTML=l.map(([a,b])=>
  `<div class="kpi"><div class="l">${a}</div><div class="v">${b}</div></div>`).join(""); }

// ---------- Tabla de cobradores ----------
// No repite las columnas de la tabla de vendedores a proposito: al supervisor de
// cobranza no le sirve lo mismo que a uno de ventas. Lo que mira es cuanta plata tiene
// que entrar por semana en cada ruta, que parte de esa ruta se le esta terminando, y
// cuanto quedo colgado -- refinanciar y clientes marcados, que es plata que no va a
// entrar sola.
function tablaCobradores(){
  const lista=filtrar(clientes);
  const pend=actividades.filter(a=>a.estado==="pendiente");
  const porC={};
  const fila=k=>porC[k]||(porC[k]={c:k,act:0,ops:0,cobrar:0,cie:0,refi:0,saldo:0,marc:0,fin:0});
  lista.forEach(c=>{
    const cobs=(c.cobradores||[]);
    if(!cobs.length) return;
    const r=c.resumen_fin||{}, marcado=!!tagDe(c.codigo), refi=esRefinanciar(c);
    cobs.forEach(k=>{
      const f=fila(k);
      if(c.estado==="activo"){
        f.act++;
        // Solo las operaciones que cobra EL: un cliente puede tener dos operaciones
        // con cobradores distintos y la plata no es de los dos.
        const suyas=opsActivas(c).filter(o=>!o.cobrador||o.cobrador===k);
        f.ops+=suyas.length;
        f.cobrar+=suyas.reduce((x,o)=>x+(o.cuota_semanal||0),0);
        if(suyas.some(o=>o.etapa==="cierre_inminente")) f.cie++;
      } else f.fin++;
      if(refi){ f.refi++; f.saldo+=r.saldo_pend||0; }
      if(marcado) f.marc++;
    });
  });
  Object.values(porC).forEach(f=>{
    f.avisos=pend.filter(a=>a.origen_usuario===f.c).length;
  });
  const filas=Object.values(porC).sort((a,b)=>b.cobrar-a.cobrar);
  if(!filas.length) return "";
  return `<div class="panel"><h3>Cobradores (${filas.length})</h3>
    <div style="font-size:.78rem;color:var(--gris);margin-bottom:8px">
      Ordenados por lo que tienen que cobrar cada semana. Tocá una fila para ver la ruta.</div>
    <div style="overflow-x:auto"><table class="tabla">
      <tr><th>Cobrador</th><th>Clientes activos</th><th>Ops activas</th><th>A cobrar/sem</th>
          <th>Cierre inminente</th><th>Refinanciar</th><th>Saldo pendiente</th>
          <th>Marcados</th><th>Avisos abiertos</th></tr>
      ${filas.map(f=>`<tr onclick="verCob('${esc(f.c)}')">
        <td style="color:var(--azul);font-weight:700">${esc(f.c)}</td>
        <td>${f.act}</td><td>${f.ops}</td>
        <td style="font-weight:700">${plata(f.cobrar)}</td>
        <td>${f.cie}</td>
        <td>${f.refi}</td>
        <td style="color:${f.saldo?'var(--violeta)':'inherit'};font-weight:${f.saldo?700:400}">${plata(f.saldo)}</td>
        <td style="color:${f.marc?'var(--rojo)':'inherit'}">${f.marc}</td>
        <td>${f.avisos}</td></tr>`).join("")}
    </table></div></div>`;
}
function verCob(c){ selCob=c; vista="cob"; marcarNav(); pintar(); window.scrollTo(0,0); }

// ---------- Vista Vendedor / Cobrador ----------
function pintarKanban(){
  const quien = vista==="vend" ? (esVend()?sesion.usuario:selVend) : (esCob()?sesion.usuario:selCob);
  const tablaCob = vista==="cob" ? tablaCobradores() : "";
  if(!quien){
    document.getElementById("kpis").innerHTML=""; document.getElementById("panel").innerHTML="";
    document.getElementById("tabla").innerHTML=tablaCob;
    document.getElementById("cols").innerHTML=`<div class="vacio">Seleccioná un ${vista==="vend"?"vendedor":"cobrador"} para ver su cartera.</div>`;
    return;
  }
  let src = vista==="vend"
    ? clientes.filter(c=>esDe(c,quien))
    : clientes.filter(c=>(c.cobradores||[]).includes(quien));
  src=filtrar(src);

  const act=src.filter(c=>c.estado==="activo");
  const opsA=act.flatMap(opsActivas);
  kpis([["Clientes activos",act.length],["Operaciones activas",opsA.length],
        ["Cierre inminente",act.filter(c=>opsActivas(c).some(o=>o.etapa==="cierre_inminente")).length],
        ["Finalizados sin renovar",src.filter(c=>c.estado!=="activo").length],
        ["Cuota total/sem",plata(opsA.reduce((s,o)=>s+(o.cuota_semanal||0),0))]]);

  pintarPanelActividades(quien,src);
  document.getElementById("tabla").innerHTML=tablaCob;

  const por={}; ETAPAS.forEach(([k])=>por[k]=[]);
  src.forEach(c=>{ const e=etapaDe(c); (por[e]||por.finalizado).push(c); });
  document.getElementById("cols").innerHTML = ETAPAS.map(([k,l,r])=>{
    const lista=por[k].sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
    return `<div class="col c-${k}">
      <div class="col-h"><div class="t">${l}</div><div class="n">${lista.length}</div><div class="r">${r}</div></div>
      <div class="col-b">${lista.slice(0,120).map(c=>tarjeta(c,quien)).join("")||'<div class="vacio" style="padding:12px">—</div>'}
      ${lista.length>120?`<div class="vacio">y ${lista.length-120} más</div>`:""}</div></div>`;
  }).join("");
}

function tarjeta(c,quien){
  const oa=opsActivas(c), r=c.resumen_fin||{};
  const t=tagDe(c.codigo), td=TAGS.find(x=>x[0]===t);
  const cuota=oa.reduce((s,o)=>s+(o.cuota_semanal||0),0);
  const cuo=oa.reduce((s,o)=>s+(o.cuotas_restantes||0),0);
  const prox=oa.slice().sort((a,b)=>String(a.fecha_fin||"").slice(6).localeCompare(String(b.fecha_fin||"").slice(6)))[0];
  const p=proxDe(c.codigo), h=hoyISO();
  const chip = p ? `<span class="chip ${p.fecha<h?"venc":p.fecha===h?"hoy":"prox"}">${TIPOS[p.tipo]||p.tipo} · ${dmy(p.fecha)}</span>`
                 : `<span class="chip sin">Sin actividad programada</span>`;
  return `<div class="tar">
    ${td?`<span class="badge" style="background:${td[2]}">${td[1]}</span>`:""}
    ${esRefinanciar(c)?`<span class="badge" style="background:var(--violeta)">Refinanciar · ${plata(r.saldo_pend)}</span>`:""}
    ${r.reformulada?`<span class="badge" style="background:#2980B9">Reformulada</span>`:""}
    ${r.cancelo_ant?`<span class="badge" style="background:var(--verde)">Canceló anticipado</span>`:""}
    <div class="nom">${esc(c.nombre)}</div>
    <div class="loc">${esc(c.localidad||"")}${c.provincia?", "+esc(c.provincia):""}</div>
    ${cuota?`<div class="cu">${plata(cuota)}/sem</div>`:""}
    ${cuo?`<div class="de">${cuo} cuota${cuo!==1?"s":""} rest.</div>`:""}
    ${prox?`<div class="de"><b>Vence: ${esc(prox.fecha_fin)}</b></div>`
          :(r.ultima_fin?`<div class="de">Finalizó: ${esc(r.ultima_fin)}</div>`:"")}
    ${c.telefono?`<div class="te">${tel(c.telefono)}</div>`:""}
    ${chip}
    <button class="b full" onclick="ficha('${esc(c.codigo)}')">Ver Ficha</button>
    <button class="b verde full" onclick="abrirAct('${esc(c.codigo)}')">${
      esVend()?"Agendar":vista==="cob"?"Avisar al vendedor":"Asignar actividad"}</button>
    <select class="sel-tag" onchange="ponerTag('${esc(c.codigo)}', this.value||null)">
      <option value="">${t?"Cambiar marca...":"Marcar cliente..."}</option>
      ${TAGS.map(([k,l])=>`<option value="${k}" ${t===k?"selected":""}>${l}</option>`).join("")}
      ${t?`<option value="">Quitar marca</option>`:""}
    </select>
  </div>`;
}

function pintarPanelActividades(quien,src){
  // Las actividades SIEMPRE quedan a cargo de un vendedor: es el que visita al cliente.
  // Por eso el cobrador no "recibe" actividades, las ORIGINA -- avisa que un cliente de
  // su ruta necesita algo. En su vista lo que sirve es ver lo que mando y si el vendedor
  // lo resolvio; listar lo que tiene asignado daba siempre cero y no se entendia nada.
  const esVistaCob = vista==="cob";
  const P = esVistaCob
    ? actividades.filter(a=>a.estado==="pendiente"&&a.origen_usuario===quien)
    : actividades.filter(a=>a.estado==="pendiente"&&a.asignado_a===quien);
  const h=hoyISO();
  const venc=P.filter(a=>(a.fecha||"")<h),hoyl=P.filter(a=>(a.fecha||"")===h),fut=P.filter(a=>(a.fecha||"")>h);
  // "Sin actividad" es sin NINGUNA actividad pendiente, la haya pedido quien la haya
  // pedido. Mirando solo las de esta persona, un cliente que el vendedor ya tenia
  // agendado volvia a aparecer como si nadie lo estuviera trabajando.
  const conAct=new Set(actividades.filter(a=>a.estado==="pendiente")
                                  .map(a=>String(a.cliente_cod)));
  const sin=src.filter(c=>c.estado==="activo"&&!conAct.has(String(c.codigo)));
  if(!P.length&&!sin.length){ document.getElementById("panel").innerHTML=""; return; }
  const fila=a=>`<div class="act ${(a.fecha||"")<h?"venc":(a.fecha||"")===h?"hoy":"prox"}">
    <b style="flex:1;min-width:130px">${esc(a.cliente_nombre)}</b>
    <span class="chip">${TIPOS[a.tipo]||esc(a.tipo)} · ${dmy(a.fecha)}${a.hora?" "+esc(a.hora):""}</span>
    <span style="color:var(--gris);font-size:.72rem">${esVistaCob?"para "+esc(a.asignado_a||"—"):"de "+esc(a.origen_usuario)}</span>
    ${a.observaciones?`<div style="flex-basis:100%;color:#555;font-size:.77rem">${esc(a.observaciones)}</div>`:""}
    ${a.asignado_a===sesion.usuario?`<button class="b auto full" onclick="abrirCierre('${a.id}')">Hecha</button>`:""}
    <button class="b auto" onclick="ficha('${esc(a.cliente_cod)}')">Ficha</button></div>`;
  const bloque=(t,arr)=>arr.length?`<div class="titulo">${t} (${arr.length})</div>`+
    arr.sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")).map(fila).join(""):"";
  document.getElementById("panel").innerHTML=`<div class="panel">
    <h3>${esVistaCob
            ? (quien===sesion.usuario?"Avisos que mandé a los vendedores"
                                     :"Avisos que mandó "+esc(quien))
            : (quien===sesion.usuario?"Mis actividades":"Actividades de "+esc(quien))} (${P.length})</h3>
    ${esVistaCob?`<div style="font-size:.77rem;color:var(--gris);margin:-4px 0 8px">
        Pedidos abiertos: el cliente necesita algo y el vendedor todavía no lo cerró.</div>`:""}
    ${bloque("Vencidas",venc)}${bloque("Hoy",hoyl)}${bloque("Próximas",fut)}
    ${sin.length?`<div class="titulo">Sin actividad programada (${sin.length})</div>
      <div style="font-size:.77rem;color:var(--gris);margin-bottom:7px">Clientes activos que
        nadie tiene agendados: ni el vendedor ni cobranza pidieron contacto.</div>
      ${sin.slice(0,15).map(c=>`<div class="act">
        <b style="flex:1;min-width:130px">${esc(c.nombre)}</b>
        ${c.telefono?`<span>${tel(c.telefono)}</span>`:`<span style="color:var(--rojo);font-size:.73rem">sin teléfono</span>`}
        <span style="color:var(--gris);font-size:.74rem">${esc(c.localidad||"")}</span>
        <button class="b auto verde full" onclick="abrirAct('${esc(c.codigo)}')">${
          esVend()?"Agendar":esVistaCob?"Avisar al vendedor":"Asignar"}</button>
        <button class="b auto" onclick="ficha('${esc(c.codigo)}')">Ficha</button>
      </div>`).join("")}
      ${sin.length>15?`<div class="vacio">y ${sin.length-15} más en las columnas</div>`:""}`:""}
  </div>`;
}

// ---------- ficha ----------
function ficha(cod){
  const c=clientes.find(x=>String(x.codigo)===String(cod)); if(!c) return;
  document.getElementById("f-nom").textContent=c.nombre;
  const oa=opsActivas(c);
  document.getElementById("f-cuerpo").innerHTML=`
    <div class="loc">${esc(c.domicilio||"")} · ${esc(c.localidad||"")}${c.provincia?", "+esc(c.provincia):""}</div>
    ${c.telefono?`<div style="margin:8px 0">${tel(c.telefono)}</div>`:""}
    ${c.negocio?`<div class="loc">Negocio: ${esc(c.negocio)}</div>`:""}
    <div class="loc">Vendedor: ${esc(c.vendedor||"—")} · Cobrador: ${esc((c.cobradores||[]).join(", ")||"—")}</div>
    <div class="titulo">Operaciones activas (${oa.length})</div>
    ${oa.length?oa.map(o=>`<div class="tar">
      <div class="nom">${esc(o.tipo)} — op. ${esc(o.operacion)}</div>
      <div class="de">${plata(o.cuota_semanal)}/sem · ${o.cuotas_restantes} cuota(s) rest.</div>
      <div class="de">Vence: ${esc(o.fecha_fin)}</div>
      ${(o.productos||[]).length?`<div class="loc" style="margin-top:4px">${esc((o.productos||[]).join(", "))}</div>`:""}
    </div>`).join(""):'<div class="vacio">Sin operaciones activas.</div>'}
    <button class="b auto" onclick="verHistorial('${esc(cod)}')">Ver historial completo (${c.ops_totales||0})</button>
    <div id="f-hist"></div>`;
  abrir("m-ficha");
}
async function verHistorial(cod){
  const d=document.getElementById("f-hist"); d.innerHTML='<div class="cargando">Buscando historial...</div>';
  try{
    const doc=await db.collection("historial").doc(String(cod)).get();
    if(!doc.exists){ d.innerHTML='<div class="vacio">Sin historial.</div>'; return; }
    const ops=(doc.data().operaciones||[]).slice()
      .sort((a,b)=>String(b.fecha_fin||"").slice(6).localeCompare(String(a.fecha_fin||"").slice(6)));
    d.innerHTML=`<div class="titulo">Historial (${ops.length})</div>`+ops.map(o=>`<div class="tar">
      <div class="nom" style="font-size:.82rem">${esc(o.tipo)} — op. ${esc(o.operacion)}</div>
      <div class="de">${esc(o.inicio||"")} a ${esc(o.fecha_fin||"")} · ${plata(o.cuota_semanal)}/sem</div>
      ${o.cancelada_anticipada?'<span class="badge" style="background:var(--verde)">Canceló anticipado</span>':""}
      ${o.reformulada?'<span class="badge" style="background:#2980B9">Reformulada</span>':""}</div>`).join("");
  }catch(e){ d.innerHTML='<div class="vacio">No se pudo traer el historial.</div>'; }
}

// ---------- actividades ----------
let actCod=null, actId=null;
function abrirAct(cod){
  const c=clientes.find(x=>String(x.codigo)===String(cod)); if(!c) return;
  actCod=String(cod);
  const d=destinoDe(c);
  document.getElementById("a-tit").textContent=
    esVend()?"Agendar actividad":vista==="cob"?"Avisar al vendedor":"Asignar actividad";
  // Si el destinatario ya no entra al sistema, avisarlo aca: la actividad se guardaria
  // igual y no la veria nadie.
  const huerfano = vendActivos && d && !vendActivos.has(d);
  document.getElementById("a-cli").textContent=c.nombre+"  (#"+cod+")"+(esVend()?"":"  →  "+d)
    +(huerfano?"  ⚠ ese vendedor ya no entra al sistema: reasigná el cliente primero":"");
  document.getElementById("a-tipo").value="llamada";
  document.getElementById("a-fecha").value=hoyISO();
  document.getElementById("a-hora").value=""; document.getElementById("a-obs").value="";
  abrir("m-act");
}
async function guardarAct(){
  const c=clientes.find(x=>String(x.codigo)===actCod);
  const f=document.getElementById("a-fecha").value;
  if(!f){ alert("Poné una fecha."); return; }
  const ahora=firebase.firestore.FieldValue.serverTimestamp();
  try{
    await db.collection("actividades").add({
      cliente_cod:actCod, cliente_nombre:c?c.nombre:"", provincia:c?(c.provincia||""):"",
      asignado_a:destinoDe(c||{}), asignado_tipo:"vendedor", historial_asignacion:[],
      origen_tipo:sesion.rol, origen_usuario:sesion.usuario, origen_motivo:null,
      tipo:document.getElementById("a-tipo").value, fecha:f,
      hora:document.getElementById("a-hora").value||null,
      observaciones:document.getElementById("a-obs").value||"",
      estado:"pendiente", resultado:null, resultado_nota:"",
      cerrada_en:null, cerrada_por:null, creado_en:ahora, visto_en:null, actividad_origen_id:null });
  }catch(e){}
  cerrar("m-act");
}
function abrirCierre(id){
  const a=actividades.find(x=>x.id===id); if(!a) return; actId=id;
  document.getElementById("c-cli").textContent=a.cliente_nombre;
  document.getElementById("c-res").innerHTML='<option value="">¿Qué pasó?</option>'+
    RESULTADOS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  document.getElementById("c-nota").value=""; abrir("m-cerr");
}
async function guardarCierre(){
  const r=document.getElementById("c-res").value;
  if(!r){ alert("Elegí qué pasó."); return; }
  const a=actividades.find(x=>x.id===actId);
  try{ await db.collection("actividades").doc(actId).update({estado:"hecha",resultado:r,
    resultado_nota:document.getElementById("c-nota").value||"",
    cerrada_en:firebase.firestore.FieldValue.serverTimestamp(),cerrada_por:sesion.usuario}); }catch(e){}
  cerrar("m-cerr");
  // Si el circuito sigue abierto se pide la proxima ahi mismo: si no se fuerza en este
  // momento, no se agenda nunca.
  const def=RESULTADOS.find(x=>x[0]===r);
  if(def&&def[2]&&a&&confirm("¿Agendar la próxima actividad para este cliente?")) abrirAct(a.cliente_cod);
}

const abrir=id=>document.getElementById(id).classList.add("on");
const cerrar=id=>document.getElementById(id).classList.remove("on");
document.querySelectorAll(".capa").forEach(c=>c.onclick=e=>{ if(e.target===c) c.classList.remove("on"); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
